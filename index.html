<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freeCodeCamp — Полный курс Python</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a23'/%3E%3Cpath d='M12 9l7 7-7 7' stroke='%23fecc4c' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19 22h4' stroke='%2300bc8c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Hack:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<style>
  :root{
    --bg:#0a0a23; --bg-2:#1b1b32; --bg-3:#2a2a40; --bg-4:#3b3b4f;
    --tx:#d0d0d5; --tx-2:#dfdfe2; --tx-3:#8d8d9a;
    --yellow-grad:linear-gradient(180deg,#fecc4c 0%,#ffac33 100%);
    --yellow:#ffac33; --yellow-dark:#f89808;
    --green:#00bc8c; --green-dark:#006b4f; --red:#d22; --red-dark:#850000;
    --blue:#002ead; --line:#3b3b4f;
    --sans:'Lato',-apple-system,'Segoe UI',sans-serif;
    --mono:'Hack','Menlo','Consolas',monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font:16px/1.6 var(--sans); display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#ffd; color:#000}
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track{background:var(--bg-2)}
  ::-webkit-scrollbar-thumb{background:var(--bg-4); border:2px solid var(--bg-2)}
  ::-webkit-scrollbar-thumb:hover{background:#555}
  button{font-family:inherit; cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--yellow); outline-offset:2px}

  #app{flex:1; display:flex; flex-direction:column; min-height:0}
  .screen{flex:1; display:flex; flex-direction:column; min-height:0}
  body.layout-challenge{overflow:hidden}
  body.sidebar-open{overflow:hidden}

  /* ================= топбар (как у freeCodeCamp) ================= */
  .topbar{
    flex:none; height:52px; display:flex; align-items:center; gap:8px;
    background:var(--bg); border-bottom:3px solid var(--bg-4);
    padding:0 14px; z-index:60; position:relative;
  }
  .burger{
    width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--tx); border:0;
  }
  .burger:hover{background:var(--bg-2)}
  .hamburger{width:22px;height:16px;position:relative}
  .hamburger i{position:absolute; left:0; width:100%; height:3px; background:currentColor; transition:.25s}
  .hamburger i:nth-child(1){top:0}
  .hamburger i:nth-child(2){top:6px}
  .hamburger i:nth-child(3){top:12px}
  .topbar.open .hamburger i:nth-child(1){top:6px; transform:rotate(45deg)}
  .topbar.open .hamburger i:nth-child(2){opacity:0}
  .topbar.open .hamburger i:nth-child(3){top:6px; transform:rotate(-45deg)}
  .logo{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--tx); padding:0 6px}
  .logo .fcc-mark{
    width:26px; height:26px; background:var(--bg-2); border:2px solid var(--bg-4);
    display:grid; place-items:center; font:700 15px var(--mono); color:var(--yellow); letter-spacing:-.06em;
  }
  .logo b{font:700 15px var(--sans); letter-spacing:.01em; color:var(--tx)}
  .logo .sub{font:600 11px var(--sans); color:var(--tx-3); letter-spacing:.06em; text-transform:uppercase}
  .crumb{font-size:13px; color:var(--tx-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:6px; min-width:0}
  .crumb .sep{opacity:.5}
  .crumb b{color:var(--tx)}
  .tb-spacer{flex:1}
  .pill{display:flex; align-items:center; gap:8px; font:600 12px var(--sans); color:var(--tx)}
  .pill .num{background:var(--bg-2); border:1px solid var(--bg-4); padding:3px 8px; border-radius:2px}
  .pill-bar{width:110px; height:8px; background:var(--bg-3); border-radius:999px; overflow:hidden}
  .pill-bar i{display:block; height:100%; background:var(--green); border-radius:999px; transition:width .4s ease}
  .tb-icon{
    width:34px;height:34px; display:inline-grid; place-items:center;
    background:transparent; border:0; color:var(--tx-3); border-radius:2px;
  }
  .tb-icon:hover{background:var(--bg-2); color:var(--tx)}

  /* ================= сайдбар урока ================= */
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; width:100%; max-width:340px;
    background:var(--bg-2); border-right:1px solid var(--line); z-index:70;
    transform:translateX(-102%); transition:transform .25s ease;
    display:flex; flex-direction:column; padding-top:52px;
  }
  body.sidebar-open .sidebar{transform:none}
  .side-head{flex:none; display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
  .side-head h3{margin:0; font:700 14px var(--sans); color:var(--tx); flex:1}
  .side-head .done{font:600 12px var(--sans); color:var(--green)}
  .side-body{flex:1; overflow-y:auto; padding:10px 0 30px}
  .side-mod{margin:2px 0}
  .side-mod>.mod-title{
    display:flex; align-items:center; gap:8px; width:100%; padding:9px 16px;
    background:none; border:0; text-align:left; color:var(--tx); font:700 13px var(--sans);
  }
  .side-mod>.mod-title:hover{background:var(--bg-3)}
  .side-mod>.mod-title .cnt{margin-left:auto; font:600 11px var(--sans); color:var(--tx-3)}
  .side-ch{display:flex; align-items:center; gap:10px; width:100%; padding:7px 16px 7px 26px; background:none; border:0; text-align:left; color:var(--tx-3); font-size:13px}
  .side-ch:hover{background:var(--bg-3); color:var(--tx)}
  .side-ch .dot{width:8px;height:8px; border-radius:50%; background:var(--bg-4); flex:none}
  .side-ch.solved .dot{background:var(--green)}
  .side-ch.solved{color:var(--tx-3)}
  .side-ch.active{background:var(--bg-3); color:var(--tx); font-weight:700}
  .side-ch.active .dot{background:var(--yellow)}
  .side-ch .no{font:600 10px var(--mono); color:var(--tx-3); flex:none; width:20px}
  .side-ch .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1}
  .side-ch .ok{color:var(--green); flex:none}

  /* ================= кнопки ================= */
  .btn{
    font:600 14px var(--sans); padding:9px 14px; border:2px solid var(--bg-4);
    background:var(--bg-3); color:var(--tx); display:inline-flex; gap:8px; align-items:center; justify-content:center;
    transition:background .15s, transform .1s; user-select:none;
  }
  .btn:hover{background:var(--bg-4)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5; pointer-events:none}
  .btn.yellow{
    background:var(--yellow-grad); border-color:var(--yellow); color:#0a0a23;
    font-weight:700; box-shadow:0 4px 0 var(--yellow-dark);
  }
  .btn.yellow:hover{filter:brightness(1.04)}
  .btn.yellow:active{box-shadow:0 2px 0 var(--yellow-dark); transform:translateY(2px)}
  .btn.yellow:disabled{box-shadow:0 4px 0 var(--yellow-dark)}
  .btn.blue{background:var(--blue); border-color:var(--blue); color:#fff}
  .btn.blue:hover{filter:brightness(1.15)}
  .btn.ghost{background:transparent; border-color:var(--bg-4); color:var(--tx-2)}
  .btn.ghost:hover{background:var(--bg-2); color:var(--tx)}
  .btn.small{padding:6px 10px; font-size:12.5px; gap:6px}
  .link{background:none;border:none;cursor:pointer;color:var(--tx-3);font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px}
  .link:hover{color:var(--tx)}
  .btn.loading svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ================= главная ================= */
  .home-hero{
    flex:none; background:var(--bg-2); border-bottom:3px solid var(--bg-4);
    padding:54px 24px 54px; text-align:center;
  }
  .home-hero .kicker{
    display:inline-flex; gap:8px; align-items:center; font:600 12px var(--sans);
    letter-spacing:.14em; text-transform:uppercase; color:var(--yellow); margin-bottom:16px;
  }
  .home-hero h1{font:700 clamp(34px,5.4vw,58px)/1.05 var(--sans); margin:0 0 14px; color:#fff; letter-spacing:-.01em}
  .home-hero h1 span{color:var(--yellow)}
  .home-hero p{color:var(--tx-2); max-width:640px; margin:0 auto 26px; font-size:17px}
  .home-actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
  .home-progress{display:flex; align-items:center; gap:14px; justify-content:center; margin-top:26px; font-size:13px; color:var(--tx-2)}
  .home-progress .bar{width:min(420px,60vw); height:10px; background:var(--bg-3); border-radius:999px; overflow:hidden}
  .home-progress .bar i{display:block; height:100%; background:var(--green); border-radius:999px; transition:width .4s}

  .curriculum{width:100%; max-width:860px; margin:0 auto; padding:34px 18px 60px}
  .curriculum h2{font:700 24px var(--sans); margin:26px 0 6px; color:var(--tx)}
  .curriculum .hint-line{color:var(--tx-3); font-size:14px; margin:0 0 20px}
  .module{
    background:var(--bg-2); border:1px solid var(--line); margin:0 0 26px;
  }
  .module-head{
    display:flex; align-items:center; gap:14px; padding:16px 20px;
    background:var(--bg-3); border-bottom:1px solid var(--line);
  }
  .module-no{font:700 12px var(--mono); color:var(--yellow); letter-spacing:.06em; flex:none}
  .module-title{font:700 18px var(--sans); color:#fff; flex:1}
  .module-count{font:600 12px var(--sans); color:var(--tx-3); flex:none}
  .ch-list{display:flex; flex-direction:column}
  .ch{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    padding:13px 20px; background:none; border:0; border-bottom:1px solid var(--bg-4);
    color:var(--tx-2); transition:background .12s;
  }
  .ch:last-child{border-bottom:0}
  .ch:hover{background:var(--bg-3)}
  .ch .dot{width:14px;height:14px; border:2px solid var(--bg-4); border-radius:50%; flex:none; background:transparent}
  .ch.solved .dot{background:var(--green); border-color:var(--green)}
  .ch.next .dot{border-color:var(--yellow); animation:pulse 1.7s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(254,204,76,.45)}
    70%{box-shadow:0 0 0 9px rgba(254,204,76,0)}
    100%{box-shadow:0 0 0 0 rgba(254,204,76,0)}
  }
  .ch .no{font:600 11px var(--mono); color:var(--tx-3); flex:none; width:26px}
  .ch .name{font-weight:400; flex:1}
  .ch.next .name{font-weight:700; color:var(--yellow)}
  .ch .stat{flex:none; display:flex; align-items:center; gap:6px; font:600 11px var(--sans); color:var(--tx-3); text-transform:uppercase; letter-spacing:.06em}
  .ch.solved .stat{color:var(--green)}
  .ch.next .stat{color:var(--yellow)}

  /* сертификат */
  .cert{
    background:var(--bg-2); border:2px solid var(--green); margin:10px 0 30px;
    padding:26px 28px; display:grid; grid-template-columns:auto 1fr auto; gap:24px; align-items:center;
  }
  .cert-ico{color:var(--green)}
  .cert-main h2{margin:0 0 6px; font:700 22px var(--sans); color:#fff}
  .cert-main p{margin:0; color:var(--tx-2); font-size:14.5px}
  .cert-side{display:flex; flex-direction:column; gap:10px; min-width:250px}
  .cert-side input{
    font:14px var(--sans); padding:10px 12px; border:1px solid var(--bg-4);
    background:var(--bg); color:var(--tx); outline:none;
  }
  .cert-side input:focus{border-color:var(--green)}
  .cert-bar{width:250px; height:10px; background:var(--bg-3); border-radius:999px; overflow:hidden}
  .cert-bar i{display:block; height:100%; background:var(--green)}

  .foot{
    border-top:3px solid var(--bg-4); padding:24px 18px;
    font:600 12px/1.9 var(--sans); color:var(--tx-3);
    display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }

  /* ================= экран урока ================= */
  .challenge{
    flex:1; min-height:0; display:grid; position:relative;
    grid-template-columns:minmax(340px,44%) 1fr;
  }
  .brief{overflow-y:auto; background:var(--bg); border-right:1px solid var(--line); padding:26px 28px 44px}
  .stamps{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap}
  .stamp{
    font:600 11px var(--sans); letter-spacing:.09em; text-transform:uppercase;
    border:1px solid var(--bg-4); padding:4px 9px; background:var(--bg-2); color:var(--tx-3); border-radius:2px;
  }
  .stamp.hl{color:var(--yellow); border-color:var(--yellow)}
  .brief h1{font:700 28px/1.2 var(--sans); letter-spacing:-.01em; margin:0 0 18px; color:#fff}
  .steps{list-style:none; margin:0; padding:0; counter-reset:s}
  .steps li{
    counter-increment:s; display:grid; grid-template-columns:34px 1fr; gap:14px;
    padding:13px 0; font-size:15px; color:var(--tx-2);
    border-bottom:1px solid var(--bg-4);
  }
  .steps li::before{
    content:counter(s); font:700 13px/26px var(--sans); color:var(--yellow);
    border:1px solid var(--bg-4); text-align:center; width:28px; height:28px;
    border-radius:50%; background:var(--bg-2);
  }
  code{
    font:600 .88em var(--mono); background:var(--bg-2); border:1px solid var(--bg-4);
    padding:1px 5px; white-space:nowrap; color:var(--tx); border-radius:2px;
  }
  .note{border-left:3px solid var(--yellow); background:var(--bg-2); padding:12px 16px; font-size:14px; color:var(--tx-2); margin:16px 0}
  .hint{margin:18px 0; border:1px solid var(--bg-4); background:var(--bg-2)}
  .hint summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;
    padding:11px 14px; font:600 12px var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--yellow);
  }
  .hint summary::-webkit-details-marker{display:none}
  .hint summary::after{content:"+"; margin-left:auto; font:700 16px var(--sans)}
  .hint[open] summary::after{content:"–"}
  .hint-body{padding:2px 16px 14px; font-size:14.5px; color:var(--tx-2); border-top:1px solid var(--bg-4); padding-top:12px}
  .brief-nav{display:flex; justify-content:space-between; gap:10px; margin-top:28px}

  .workbench{display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg-2)}
  .toolbar{
    flex:none; display:flex; gap:10px; align-items:center; padding:10px 14px;
    border-bottom:1px solid var(--line); background:var(--bg); flex-wrap:wrap;
  }
  .kbd{margin-left:auto; font:600 11px var(--sans); color:var(--tx-3)}
  kbd{background:var(--bg-3); border:1px solid var(--bg-4); border-bottom-width:2px; border-radius:3px; padding:1px 5px; font:600 11px var(--mono); color:var(--tx-2)}
  .editor-wrap{flex:1; min-height:0; background:#0b0b1f}
  .editor-wrap > div{height:100%}
  .CodeMirror{height:100%; background:#0b0b1f; color:#d0d0d5; font:14px/1.6 var(--mono); padding:10px 6px}
  .CodeMirror-gutters{background:#0b0b1f; border-right:1px solid var(--bg-3)}
  .CodeMirror-linenumber{color:#3f3f5f}
  .cm-s-fcc .cm-keyword{color:#ff9c7a; font-weight:700}
  .cm-s-fcc .cm-string{color:#b5e853}
  .cm-s-fcc .cm-number{color:#ffe066}
  .cm-s-fcc .cm-comment{color:#6f6f8f; font-style:italic}
  .cm-s-fcc .cm-def{color:#e8e8ff}
  .cm-s-fcc .cm-builtin{color:#77d8d8}
  .cm-s-fcc .cm-atom{color:#ff9c7a}
  .cm-s-fcc .cm-operator{color:#d8d8ef}
  .cm-s-fcc .cm-variable{color:#d0d0d5}
  .cm-s-fcc .cm-variable-2{color:#a9b6e8}
  .cm-s-fcc .CodeMirror-cursor{border-left:2px solid #ffe066}
  .cm-s-fcc .CodeMirror-selected{background:#1b1b5a}
  .cm-s-fcc .CodeMirror-activeline-background{background:#12122e}
  .cm-s-fcc .CodeMirror-matchingbracket{color:#ffe066 !important; outline:1px solid #3f3f5f}
  .ta-fallback{
    width:100%;height:100%;background:#0b0b1f;color:#d0d0d5;border:0;resize:none;
    font:14px/1.6 var(--mono);padding:16px;outline:none;
  }

  .console{
    flex:none; height:34%; min-height:190px; display:flex; flex-direction:column;
    background:var(--bg); border-top:1px solid var(--line);
  }
  .console-bar{
    flex:none; display:flex; align-items:center; gap:10px; padding:7px 14px;
    border-bottom:1px solid var(--line); color:var(--tx-3);
    font:600 11px var(--sans); text-transform:uppercase; letter-spacing:.09em;
  }
  .console-bar .right{margin-left:auto}
  .console-body{flex:1; overflow:auto; padding:12px 16px 16px; font:13px/1.7 var(--mono); color:#d8d8ef; white-space:pre-wrap; word-break:break-word}
  .console-empty{color:var(--tx-3); font-style:italic}
  .out{color:#d8d8ef}
  .err{display:flex; gap:10px; align-items:flex-start; color:#f88; margin:8px 0}
  .err .err-tag, .tests-head{flex:none; font-size:10px; letter-spacing:.1em; text-transform:uppercase; border:1px solid #7d1f1f; color:#f88; padding:2px 7px; border-radius:2px}
  .blocked{color:var(--yellow); font-style:italic; margin-top:8px}
  .tests-head{margin:14px 0 6px; color:#a4f0d8; border-color:var(--green-dark)}
  .test{display:flex; gap:10px; padding:8px 10px; border:1px solid var(--bg-4); margin:5px 0; align-items:flex-start; white-space:normal}
  .test .ti{flex:none; margin-top:3px}
  .test.ok{border-color:var(--green-dark)}
  .test.ok .ti{color:var(--green)}
  .test.fail{border-color:#7d1f1f}
  .test.fail .ti{color:#f88}
  .test b{font-weight:700; font-size:13px}
  .test em{display:block; font-style:normal; color:#ffb3b3; font-size:12.5px; margin-top:3px}
  .success{
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    border:2px solid var(--green); background:#0a2a20; padding:14px 16px; margin-top:14px;
    animation:rise .3s ease;
  }
  .success b{color:#7affd0; font:700 15px var(--sans); display:block}
  .success span{color:#4fd1a0; font-size:13px}
  .success .s-icon{margin-right:8px; vertical-align:-2px}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}}

  /* ================= тосты, модалка, загрузчик ================= */
  #toasts{position:fixed; right:18px; bottom:18px; z-index:120; display:flex; flex-direction:column; gap:10px}
  .toast{
    background:var(--bg-2); color:var(--tx); padding:12px 16px; font:600 13px var(--sans);
    border:1px solid var(--bg-4); border-left:4px solid var(--yellow);
    display:flex; align-items:center; gap:8px; animation:tin .25s ease; max-width:360px;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
  }
  .toast.ok{border-left-color:var(--green)}
  .toast.hide{opacity:0; transform:translateX(10px); transition:.3s}
  @keyframes tin{from{opacity:0; transform:translateY(8px)}}

  .overlay{
    position:fixed; inset:0; z-index:100; background:rgba(5,5,20,.72);
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:tin .2s ease;
  }
  .overlay[hidden]{display:none}
  .boot-card,.modal{
    background:var(--bg-2); border:1px solid var(--bg-4); box-shadow:0 14px 40px rgba(0,0,0,.6);
    padding:28px 30px; width:100%; max-width:460px; animation:rise .25s ease;
  }
  .boot-title{font:700 19px var(--sans); margin-bottom:4px; color:#fff}
  .boot-sub{font:600 12px var(--sans); color:var(--tx-3); margin-bottom:16px}
  .boot-log{font:12.5px/1.9 var(--mono); color:var(--tx-2); min-height:120px; margin-bottom:14px}
  .boot-log .done{color:var(--green); font-weight:700}
  .boot-log div::before{content:"» "; color:var(--yellow)}

import io, json, os, contextlib

def _run_user(src, tests_json, stdin_json, files_json):
    tests = json.loads(tests_json)
    stdin_vals = json.loads(stdin_json)
    files = json.loads(files_json)
    for name, content in files.items():
        path = os.path.join(os.getcwd(), name)
        d = os.path.dirname(path)
        if d:
            os.makedirs(d, exist_ok=True)
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content)
    ns = {'__name__': '__main__'}
    _inputs = list(stdin_vals)
    def _fake_input(prompt=''):
        if prompt:
            print(prompt, end='')
        if not _inputs:
            raise EOFError('input(): заготовленные строки ввода закончились')
        v = _inputs.pop(0)
        print(v)
        return v
    ns['input'] = _fake_input
    buf = io.StringIO()
    err = None
    try:
        with contextlib.redirect_stdout(buf):
            code = compile(src, '<ваш код>', 'exec')
            exec(code, ns)
    except BaseException as e:
        line = getattr(e, 'lineno', None)
        tb = e.__traceback__
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == '<ваш код>':
                line = tb.tb_lineno
            tb = tb.tb_next
        err = {'type': type(e).__name__, 'msg': str(e), 'line': line}
    out = buf.getvalue()
    results = []
    if err is None:
        def _nl(s):
            return [l.strip() for l in s.strip().splitlines() if l.strip()]
        g2 = dict(ns)
        g2['OUT'] = out
        g2['SRC'] = src
        g2['_nl'] = _nl
        for t in tests:
            tg = dict(g2)
            ok = True
            msg = ''
            try:
                exec(compile(t['code'], '<test>', 'exec'), tg)
            except AssertionError as e:
                ok = False
                msg = str(e) or ('Проверка не пройдена: ' + t['title'])
            except BaseException as e:
                ok = False
                msg = type(e).__name__ + ': ' + str(e)
            results.append({'title': t['title'], 'ok': ok, 'msg': msg})
    return json.dumps({'out': out, 'err': err, 'tests': results}, ensure_ascii=False)
`.trim();

const ALL = [];

/* ---------- состояние ---------- */
const KEY = 'fcc-python-state-v1';
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object') return { solved: s.solved || {}, code: s.code || {}, name: s.name || '' };
  }catch(e){}
  return { solved:{}, code:{}, name:'' };
}
let state = loadState();
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };
const solvedCount = () => ALL.filter(c => state.solved[c.id]).length;
const nextChallenge = () => ALL.find(c => !state.solved[c.id]) || null;
const go = id => { location.hash = '#/c/' + id; };

/* ---------- рантайм Python (Pyodide в воркере) ---------- */
const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/';
const WORKER_SRC = `
let pyodide = null, runner = null;
self.onmessage = async (ev) => {
  const m = ev.data;
  if (m.type !== 'run') return;
  try {
    if (!pyodide) {
      importScripts('${PYODIDE_URL}pyodide.js');
      pyodide = await loadPyodide({ indexURL: '${PYODIDE_URL}' });
      pyodide.runPython(${JSON.stringify(PROLOG)});
      runner = pyodide.globals.get('_run_user');
      self.postMessage({ type: 'ready' });
    }
    if (!runner) runner = pyodide.globals.get('_run_user');
    const payload = runner(m.code, JSON.stringify(m.tests || []), JSON.stringify(m.stdin || []), JSON.stringify(m.files || {}));
    self.postMessage({ type: 'result', id: m.id, payload: String(payload) });
  } catch (e) {
    self.postMessage({ type: 'result', id: m.id, error: String(e && e.message || e) });
  }
};`;

let runtime = null, runtimeReadyEver = false, jobSeq = 0;
const jobs = new Map();
let bootLogTimer = null, bootShown = false;

function failAll(err){
  jobs.forEach(j => { clearTimeout(j.timer); j.reject(err); });
  jobs.clear();
}

function getRuntime(){
  if (runtime) return runtime;
  let w = null;
  try{
    const blob = new Blob([WORKER_SRC], { type:'text/javascript' });
    w = new Worker(URL.createObjectURL(blob));
  }catch(e){ w = null; }
  if (w){
    w.onmessage = ev => {
      const m = ev.data;
      if (m.type === 'ready'){ return; }
      if (m.type === 'result' && jobs.has(m.id)){
        const j = jobs.get(m.id);
        jobs.delete(m.id);
        clearTimeout(j.timer);
        if (m.error) j.reject(new Error(m.error));
        else { try{ j.resolve(JSON.parse(m.payload)); } catch(e){ j.reject(new Error('Некорректный ответ рантайма')); } }
      }
    };
    w.onerror = () => {
      failAll(new Error('Ошибка рантайма Python. Проверьте подключение к сети и попробуйте ещё раз.'));
      try{ w.terminate(); }catch(e){}
      runtime = null;
      hideBoot(false);
    };
    runtime = { type:'worker', w };
  } else {
    runtime = { type:'main' };
  }
  return runtime;
}

let mainPy = null, mainLoad = null;
function ensureMain(){
  if (mainPy) return Promise.resolve();
  if (!mainLoad){
    mainLoad = (async () => {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = PYODIDE_URL + 'pyodide.js';
        s.onload = res;
        s.onerror = () => rej(new Error('не удалось загрузить pyodide.js'));
        document.head.appendChild(s);
      });
      mainPy = await loadPyodide({ indexURL: PYODIDE_URL });
      mainPy.runPython(PROLOG);
    })();
  }
  return mainLoad;
}

function pyRun(code, tests, stdin, files){
  return new Promise((resolve, reject) => {
    const rt = getRuntime();
    const id = ++jobSeq;
    const job = { resolve, reject, timer: 0 };
    job.timer = setTimeout(() => {
      jobs.delete(id);
      if (rt.type === 'worker' && runtime){ try{ rt.w.terminate(); }catch(e){} runtime = null; }
      reject(new Error('Код выполнялся дольше 20 секунд — возможно, в нём бесконечный цикл.'));
    }, 20000);
    jobs.set(id, job);
    showBootIfNeeded();
    if (rt.type === 'worker'){
      rt.w.postMessage({ type:'run', id, code, tests, stdin, files });
    } else {
      ensureMain().then(() => {
        const r = mainPy.globals.get('_run_user');
        const payload = r(code, JSON.stringify(tests), JSON.stringify(stdin || []), JSON.stringify(files || {}));
        const j = jobs.get(id);
        if (j){ clearTimeout(j.timer); jobs.delete(id); j.resolve(JSON.parse(String(payload))); }
      }).catch(e => {
        const j = jobs.get(id);
        if (j){ clearTimeout(j.timer); jobs.delete(id); }
        reject(new Error('Не удалось загрузить Python: ' + e.message));
      });
    }
  });
}

function showBootIfNeeded(){
  if (runtimeReadyEver || bootShown) return;
  bootShown = true;
  const ov = el('boot-overlay'), log = el('boot-log');
  ov.hidden = false;
  log.innerHTML = '';
  const lines = [
    'Проверяю окружение браузера…',
    'Загружаю CPython 3.12 (WebAssembly)…',
    'Разворачиваю стандартную библиотеку…',
    'Готовлю песочницу для кода…'
  ];
  let i = 0;
  bootLogTimer = setInterval(() => {
    if (i < lines.length){
      const d = document.createElement('div');
      d.textContent = lines[i++];
      log.appendChild(d);
    }
  }, 750);
}
function hideBoot(ok){
  if (!bootShown) return;
  clearInterval(bootLogTimer);
  const log = el('boot-log');
  if (log){
    const d = document.createElement('div');
    d.className = 'done';
    d.textContent = ok ? 'Готово.' : 'Не удалось.';
    log.appendChild(d);
  }
  setTimeout(() => { el('boot-overlay').hidden = true; bootShown = false; }, 420);
}

/* ---------- тосты и модалка ---------- */
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.innerHTML = (kind === 'ok' ? icon('check', 13) : icon('flame', 13)) + '<span>' + esc(msg) + '</span>';
  el('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 350); }, 3400);
}
function confirmDlg(o){
  return new Promise(res => {
    el('modal-root').innerHTML =
      `<div class="overlay"><div class="modal">
        <h3>${o.title}</h3><p>${o.text}</p>
        <div class="modal-actions">
          <button class="btn small ghost" id="m-cancel">${o.cancel || 'Отмена'}</button>
          <button class="btn small yellow" id="m-ok">${o.ok}</button>
        </div></div></div>`;
    const close = v => { el('modal-root').innerHTML = ''; res(v); };
    el('m-ok').onclick = () => close(true);
    el('m-cancel').onclick = () => close(false);
    el('modal-root').querySelector('.overlay').onclick = e => { if (e.target.classList.contains('overlay')) close(false); };
  });
}

/* ---------- сайдбар (дерево курса) ---------- */
function renderSidebar(activeId){
  const done = solvedCount(), total = ALL.length;
  el('side-done').textContent = done + '/' + total;
  let html = '';
  MODULES.forEach(m => {
    const cnt = m.challenges.filter(c => state.solved[c.id]).length;
    html += `<div class="side-mod">`;
    html += `<button class="mod-title" data-side-mod="${m.no}"><span>${m.no}</span> ${esc(m.title)}<span class="cnt">${cnt}/${m.challenges.length}</span></button>`;
    m.challenges.forEach(c => {
      const cls = (c.id === activeId ? 'active ' : '') + (state.solved[c.id] ? 'solved' : '');
      const gi = ALL.indexOf(c) + 1;
      html += `<button class="side-ch ${cls}" data-go="${c.id}">
        <span class="dot"></span><span class="no">${String(gi).padStart(2,'0')}</span>
        <span class="t">${esc(c.title)}</span>
        ${state.solved[c.id] ? '<span class="ok">' + icon('check', 12) + '</span>' : ''}
      </button>`;
    });
    html += `</div>`;
  });
  el('side-body').innerHTML = html;
  el('side-body').querySelectorAll('[data-go]').forEach(b => {
    b.onclick = () => { closeSidebar(); go(b.dataset.go); };
  });
  // свернуть модули, в которых нет активного урока
  el('side-body').querySelectorAll('[data-side-mod]').forEach(b => {
    const mod = MODULES.find(m => m.no === b.dataset.sideMod);
    const hasActive = mod.challenges.some(c => c.id === activeId);
    if (!hasActive){
      b.closest('.side-mod').querySelectorAll('.side-ch').forEach(ch => ch.hidden = true);
    }
  });
}
function openSidebar(){ document.body.classList.add('sidebar-open'); syncTopbar(); }
function closeSidebar(){ document.body.classList.remove('sidebar-open'); syncTopbar(); }

/* ---------- общие блоки ---------- */
function syncTopbar(){
  const s = solvedCount(), total = ALL.length;
  const pct = Math.round(s / total * 100);
  const n = document.querySelector('.pill .num'), b = document.querySelector('.pill-bar i');
  if (n) n.textContent = s + '/' + total;
  if (b) b.style.width = pct + '%';

  const s = solvedCount(), total = ALL.length;

        ${ch.note ? `<div class="note">${ch.note}</div>` : ''}
        ${ch.hint ? `<details class="hint"><summary>${icon('bulb', 14)} Подсказка</summary><div class="hint-body">${ch.hint}</div></details>` : ''}
        <div class="brief-nav">
          <button class="btn small" id="bn-prev" ${prev ? '' : 'disabled'}>${icon('left', 13)} Назад</button>
          <button class="btn small" id="bn-next" ${nxt ? '' : 'disabled'}>Далее ${icon('right', 13)}</button>
        </div>
      </aside>
      <section class="workbench">
        <div class="toolbar">
          <button class="btn small blue" id="btn-run">${icon('play', 12)} Запустить</button>
          <button class="btn small yellow" id="btn-check">${icon('check', 13)} Run the Tests</button>
          <button class="btn small ghost" id="btn-seed" title="Вернуть стартовый код">${icon('reset', 13)} Сбросить</button>
          <span class="kbd"><kbd>ctrl</kbd>+<kbd>⏎</kbd> запуск · <kbd>ctrl</kbd>+<kbd>shift</kbd>+<kbd>⏎</kbd> тесты</span>
        </div>
        <div class="editor-wrap"><div id="editor"></div></div>
        <div class="console">
          <div class="console-bar"><span style="display:inline-flex;align-items:center;gap:8px">${icon('term', 13)} Консоль</span><button class="link right" id="btn-clear">очистить</button></div>
          <div class="console-body" id="console-body"><div class="console-empty">// Нажмите «Run the Tests», чтобы проверить решение. Кнопка «Запустить» просто выполняет код.</div></div>
        </div>
      </section>
    </div>
  </div>`;

  renderSidebar(ch.id);
  bindTopbar();
  initEditor(ch);
  el('btn-run').onclick = () => doRun(ch, 'run');
  el('btn-check').onclick = () => doRun(ch, 'check');
  el('btn-clear').onclick = () => { el('console-body').innerHTML = '<div class="console-empty">// очищено</div>'; };
  el('btn-seed').onclick = async () => {
    const ok = await confirmDlg({ title:'Вернуть стартовый код?', text:'Ваше текущее решение в этом уроке будет заменено исходным шаблоном.', ok:'Заменить' });
    if (!ok) return;
    state.code[ch.id] = ch.seed; save();
    if (cm) cm.setValue(ch.seed); else if (taEl) taEl.value = ch.seed;
    toast('Код сброшен к стартовому');
  };
  el('bn-prev').onclick = () => prev && go(prev.id);
  el('bn-next').onclick = () => nxt && go(nxt.id);
}

function initEditor(ch){
  const host = el('editor');
  const val = state.code[ch.id] !== undefined ? state.code[ch.id] : ch.seed;
  cm = null; taEl = null;
  if (window.CodeMirror){
    cm = CodeMirror(host, {
      value: val, mode:'python', theme:'fcc', lineNumbers:true,
      indentUnit:4, matchBrackets:true, autoCloseBrackets:true,
      extraKeys:{
        'Ctrl-Enter': () => doRun(ch, 'run'),
        'Cmd-Enter':  () => doRun(ch, 'run'),
        'Ctrl-Shift-Enter': () => doRun(ch, 'check'),
        'Cmd-Shift-Enter':  () => doRun(ch, 'check'),
        'Tab': cmi => cmi.somethingSelected() ? cmi.indentSelection('add') : cmi.replaceSelection('    ')
      }
    });
    let t = null;
    cm.on('change', () => {
      clearTimeout(t);
      t = setTimeout(() => { state.code[ch.id] = cm.getValue(); save(); }, 400);
    });
    setTimeout(() => cm.refresh(), 60);
  } else {
    host.innerHTML = '';
    const ta = document.createElement('textarea');
    ta.className = 'ta-fallback';
    ta.value = val;
    ta.spellcheck = false;
    ta.addEventListener('input', () => { state.code[ch.id] = ta.value; save(); });
    ta.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); doRun(ch, e.shiftKey ? 'check' : 'run'); }
    });
    host.appendChild(ta);
    taEl = ta;
  }
}
const getCode = () => cm ? cm.getValue() : taEl.value;

async function doRun(ch, mode){
  if (busy) return;
  busy = true;
  const rb = el('btn-run'), cb = el('btn-check');
  if (rb) rb.classList.add('loading');
  if (cb) cb.classList.add('loading');
  if (rb) rb.disabled = true;
  if (cb) cb.disabled = true;
  const code = getCode();
  state.code[ch.id] = code; save();
  try{
    const res = await pyRun(code, mode === 'check' ? (ch.tests || []) : [], ch.stdin || [], ch.files || {});
    runtimeReadyEver = true;
    hideBoot(true);
    showResult(ch, mode, res);
  } catch(e){
    runtimeReadyEver = true;
    hideBoot(false);
    const b = el('console-body');
    if (b) b.innerHTML = `<div class="err"><span class="err-tag">ошибка</span><span>${esc(e.message)}</span></div>`;
  }
  if (rb) rb.classList.remove('loading');
  if (cb) cb.classList.remove('loading');
  if (rb) rb.disabled = false;
  if (cb) cb.disabled = false;
  busy = false;
}

function showResult(ch, mode, res){
  const body = el('console-body');
  if (!body) return;
  let html = '';
  if (res.out) html += `<div class="out">${esc(res.out)}</div>`;
  if (res.err){
    const e = res.err;
    html += `<div class="err"><span class="err-tag">ошибка</span><span>Строка ${e.line != null ? e.line : '?'} — ${esc(e.type)}: ${esc(e.msg)}</span></div>`;
  }
  if (mode === 'check'){
    if (res.err){
      html += `<div class="blocked">Тесты не запускались — сначала исправьте ошибку в коде.</div>`;
    } else {
      const t = res.tests || [];
      const passed = t.filter(x => x.ok).length;
      html += `<div class="tests-head">Проверки — ${passed}/${t.length}</div>`;
      html += t.map(x =>
        `<div class="test ${x.ok ? 'ok' : 'fail'}">
          <span class="ti">${icon(x.ok ? 'check' : 'x', 13)}</span>
          <div><b>${esc(x.title)}</b>${x.ok ? '' : `<em>${esc(x.msg)}</em>`}</div>
        </div>`).join('');
      if (t.length && t.every(x => x.ok)){
        const first = !state.solved[ch.id];
        if (first){ state.solved[ch.id] = true; save(); syncTopbar(); renderSidebar(ch.id); }
        const nx = ALL[ALL.indexOf(ch) + 1];
        html += `<div class="success">
          <div><b><span class="s-icon">${icon('check', 15)}</span>${first ? 'Все проверки пройдены — шаг сдан!' : 'Шаг уже был сдан — отличная работа.'}</b>
          <span>${first ? `Прогресс: ${solvedCount()}/${ALL.length}.` : ''}</span></div>
          ${nx
            ? `<button class="btn small yellow" id="go-next">Следующий шаг ${icon('right', 12)}</button>`
            : `<button class="btn small yellow" id="go-cert">Курс пройден — к сертификату ${icon('right', 12)}</button>`}
        </div>`;
        if (first) toast(`Шаг сдан · ${solvedCount()}/${ALL.length}`, 'ok');
        body.innerHTML = html;
        const gn = el('go-next');
        if (gn) gn.onclick = () => go(nx.id);
        const gc = el('go-cert');
        if (gc) gc.onclick = () => {
          location.hash = '#/';
          setTimeout(() => { const c = el('cert'); if (c) c.scrollIntoView({ behavior:'smooth' }); }, 200);
          toast('Курс полностью пройден!', 'ok');
        };
        return;
      }
    }
  }
  body.innerHTML = html || '<div class="console-empty">// Код выполнен. Вывода нет — если это неожиданно, проверьте print().</div>';
}

/* ---------- сброс прогресса ---------- */
async function resetProgress(){
  const ok = await confirmDlg({
    title:'Сбросить прогресс?',
    text:'Будут удалены отметки о сданных шагах и весь сохранённый код. Это действие нельзя отменить.',
    ok:'Сбросить всё'
  });
  if (!ok) return;
  state = { solved:{}, code:{}, name: state.name };
  save();
  toast('Прогресс сброшен');
  route();
}

/* ---------- сертификат (canvas → PNG) ---------- */
async function downloadCert(){
  const name = (state.name || '').trim() || 'Безымянный питонист';
  try{ await document.fonts.ready; }catch(e){}
  const W = 1600, H = 1130;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#0a0a23'; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,255,255,.04)';
  for (let i = 24; i < W; i += 30) for (let j = 24; j < H; j += 30) x.fillRect(i, j, 2, 2);
  x.strokeStyle = '#00bc8c';
  x.lineWidth = 8; x.strokeRect(46, 46, W - 92, H - 92);
  x.lineWidth = 2; x.strokeRect(70, 70, W - 140, H - 140);
  x.fillStyle = '#fecc4c';
  [[70, 70], [W - 88, 70], [70, H - 88], [W - 88, H - 88]].forEach(([a, b]) => x.fillRect(a, b, 18, 18));
  x.textAlign = 'center';
  x.fillStyle = '#fecc4c';
  x.font = '700 28px "Hack", monospace';
  x.fillText('freeCodeCamp · СЕРТИФИКАТ', W / 2, 190);
  x.fillStyle = '#d0d0d5';
  x.font = '400 26px "Lato", sans-serif';
  x.fillText('настоящим подтверждается, что', W / 2, 330);
  x.fillStyle = '#fecc4c';
  x.font = '700 92px "Lato", sans-serif';
  x.fillText(name, W / 2, 470, 1040);
  x.strokeStyle = '#3b3b4f'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(W / 2 - 330, 512); x.lineTo(W / 2 + 330, 512); x.stroke();
  x.fillStyle = '#d0d0d5';
  x.font = '400 28px "Lato", sans-serif';
  x.fillText('успешно завершил(а) полный курс', W / 2, 606);
  x.fillStyle = '#ffffff';
  x.font = '700 46px "Lato", sans-serif';
  x.fillText('«Python: с нуля до собственных классов»', W / 2, 678);
  x.fillStyle = '#8d8d9a';
  x.font = '400 22px "Hack", monospace';
  x.fillText(`${ALL.length} шагов · ${MODULES.length} модулей · код выполнялся в браузере · ${new Date().toLocaleDateString('ru-RU')}`, W / 2, 786);
  x.fillStyle = '#00bc8c';
  x.font = '700 26px "Hack", monospace';
  x.fillText('< /> freeCodeCamp', W / 2, 952);
  const a = document.createElement('a');
  a.download = 'fcc-python-certificate.png';
  a.href = c.toDataURL('image/png');
  a.click();
  toast('Сертификат сохранён', 'ok');
}

/* ---------- роутер ---------- */
const app = el('app');
function route(){
  closeSidebar();
  const m = location.hash.match(/^#\/c\/(.+)$/);
  const ch = m && ALL.find(c => c.id === m[1]);
  if (ch) renderChallenge(ch);
  else renderHome();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ch]');
  if (b) go(b.dataset.ch);
});
route();
</script>
