Python — это высокоуровневый язык программирования общего назначения, созданный **Гвидо ван Россумом** и впервые выпущенный в 1991 году.

### Почему Python?

- 🟢 **Простой синтаксис** — код читается почти как английский текст
- 🟢 **Огромное сообщество** — миллионы разработчиков по всему миру
- 🟢 **Универсальность** — веб, наука, AI, автоматизация, игры
- 🟢 **Востребованность** — один из самых популярных языков в мире

### Где используется Python?

| Область | Примеры |
|---------|---------|
| Веб-разработка | Django, Flask, FastAPI |
| Data Science | pandas, NumPy, matplotlib |
| Machine Learning | TensorFlow, PyTorch, scikit-learn |
| Автоматизация | скрипты, боты, парсинг |
| Разработка игр | Pygame |

Комментарии — это заметки в коде, которые объясняют что делает программа. Python игнорирует комментарии при выполнении.

Однострочный комментарий начинается с символа \`#\`:

\`\`\`python
# Это комментарий

\`\`\`

\`\`\`python
"""
Это многострочный комментарий.
Он может занимать несколько строк.
"""
\`\`\`

1. **Объяснение логики** — почему код написан именно так
2. **Временное отключение** — можно "закомментировать" строку

    grade = "C"

Цикл \`for\` используется для перебора элементов последовательности.

\`\`\`python

### Функция range()

\`\`\`python
# range(stop) — от 0 до stop-1
for i in range(5):
    print(i)  # 0, 1, 2, 3, 4

# range(start, stop) — от start до stop-1
for i in range(2, 6):
    print(i)  # 2, 3, 4, 5

# range(start, stop, step) — с шагом
for i in range(0, 10, 2):
    print(i)  # 0, 2, 4, 6, 8
\`\`\`

### Перебор строки

\`\`\`python
for char in "Python":
    print(char, end=" ")  # P y t h o n
\`\`\`

### enumerate() — индекс и значение

\`\`\`python
colors = ["красный", "зелёный", "синий"]

for index, color in enumerate(colors):

# 0: красный
# 1: зелёный
# 2: синий

for i in range(3):

                        content: `## Цикл while

Цикл \`while\` выполняется, пока условие истинно.

### Базовый while

\`\`\`python
count = 0
while count < 5:
    print(count)
    count += 1  # не забудьте увеличить!
\`\`\`

### break — выход из цикла

\`\`\`python
while True:
    answer = input("Введите 'q' для выхода: ")
    if answer == 'q':
        break
    print(f"Вы ввели: {answer}")
\`\`\`

### continue — пропуск итерации

\`\`\`python
for i in range(10):
    if i % 2 == 0:
        continue  # пропускаем чётные
    print(i)  # 1, 3, 5, 7, 9
\`\`\`

### else в цикле

\`\`\`python
# else выполняется, если цикл НЕ прерван через break
for i in range(5):
    if i == 10:
        break
else:
    print("Цикл завершён нормально")
\`\`\`

### ⚠️ Бесконечный цикл

Будьте осторожны — если условие всегда True и нет break, цикл будет бесконечным:

\`\`\`python
# ❌ Опасно!
while True:
    print("Бесконечность!")

# ✅ Безопасно
count = 0
while count < 100:
    print(count)
    count += 1

                        content: `## Функции в Python

Функция — это блок кода, который выполняет определённую задачу и может быть вызван многократно.

### Определение функции

\`\`\`python
def greet():
    print("Привет!")

greet()  # Вызов функции
\`\`\`

### Параметры и аргументы

\`\`\`python
def greet(name):
    print(f"Привет, {name}!")

greet("Алиса")  # Привет, Алиса!

        // ==================== УТИЛИТЫ ====================

        function highlightPython(code) {
            let html = code
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            html = html.replace(/(#.*$)/gm, '<span style="color: #4ade80;">$1</span>');
            html = html.replace(/("""[\s\S]*?"""|\'\'\'[\s\S]*?\'\'\')/g, '<span style="color: #fde047;">$1</span>');
            html = html.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span style="color: #fde047;">$1</span>');

            const keywords = ['def', 'class', 'if', 'elif', 'else', 'for', 'while', 'return', 'import', 'from', 'as', 'try', 'except', 'finally', 'raise', 'with', 'yield', 'lambda', 'pass', 'break', 'continue', 'and', 'or', 'not', 'in', 'is', 'True', 'False', 'None', 'global', 'nonlocal', 'assert', 'del', 'async', 'await'];
            keywords.forEach(kw => {
                const regex = new RegExp(`\\b(${kw})\\b`, 'g');
                html = html.replace(regex, '<span style="color: #c084fc; font-weight: 600;">$1</span>');
            });

            const builtins = ['print', 'len', 'range', 'int', 'str', 'float', 'list', 'dict', 'set', 'tuple', 'type', 'input', 'open', 'map', 'filter', 'sorted', 'sum', 'min', 'max', 'abs', 'round', 'enumerate', 'zip', 'isinstance', 'super', 'property', 'staticmethod', 'classmethod', 'next', 'iter'];
            builtins.forEach(fn => {
                const regex = new RegExp(`\\b(${fn})\\b(?=\\()`, 'g');
                html = html.replace(regex, '<span style="color: #60a5fa;">$1</span>');
            });

            html = html.replace(/\b(\d+\.?\d*)\b/g, '<span style="color: #fb923c;">$1</span>');
            html = html.replace(/(@\w+)/g, '<span style="color: #f472b6;">$1</span>');

            return html;
        }

        function renderMarkdown(text) {
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            html = html.replace(/```python\n([\s\S]*?)```/g, (_, code) => {
                return `<div style="margin: 1rem 0; border-radius: 0.5rem; overflow: hidden;"><div style="background: #1f2937; padding: 0.5rem 1rem; font-size: 0.75rem; color: #9ca3af; display: flex; align-items: center; gap: 0.5rem;"><span style="width: 0.75rem; height: 0.75rem; border-radius: 50%; background: #ef4444; display: inline-block;"></span><span style="width: 0.75rem; height: 0.75rem; border-radius: 50%; background: #eab308; display: inline-block;"></span><span style="width: 0.75rem; height: 0.75rem; border-radius: 50%; background: #22c55e; display: inline-block;"></span><span style="margin-left: 0.5rem;">python</span></div><pre style="background: #111827; padding: 1rem; overflow-x: auto; font-size: 0.875rem; line-height: 1.625;"><code>${highlightPython(code.trim())}</code></pre></div>`;
            });

            html = html.replace(/^### (.+)$/gm, '<h3 style="font-size: 1.125rem; font-weight: 700; color: #f3f4f6; margin-top: 1.5rem; margin-bottom: 0.5rem;">$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2 style="font-size: 1.5rem; font-weight: 700; color: #ffffff; margin-top: 2rem; margin-bottom: 1rem;">$1</h2>');

            html = html.replace(/\|(.+)\|\n\|[-| ]+\|\n((?:\|.+\|\n?)*)/g, (_, header, body) => {
                const headers = header.split('|').map(h => h.trim()).filter(Boolean);
                const rows = body.trim().split('\n').map(row =>
                    row.split('|').map(cell => cell.trim()).filter(Boolean)
                );
                let table = '<div style="margin: 1rem 0; overflow-x: auto;"><table style="width: 100%; font-size: 0.875rem; border-collapse: collapse;"><thead><tr>';
                headers.forEach(h => { table += `<th style="background: #374151; color: #e5e7eb; padding: 0.5rem 1rem; text-align: left; border: 1px solid #4b5563;">${h}</th>`; });
                table += '</tr></thead><tbody>';
                rows.forEach(row => {
                    table += '<tr>';
                    row.forEach(cell => { table += `<td style="padding: 0.5rem 1rem; border: 1px solid #374151; color: #d1d5db;">${cell}</td>`; });
                    table += '</tr>';
                });
                table += '</tbody></table></div>';
                return table;
            });

            html = html.replace(/^> (.+)$/gm, '<blockquote style="border-left: 4px solid #3b82f6; padding-left: 1rem; padding-top: 0.5rem; padding-bottom: 0.5rem; margin: 0.75rem 0; background: rgba(59, 130, 246, 0.1); border-radius: 0 0.25rem 0.25rem 0; color: #93c5fd;">$1</blockquote>');

            html = html.replace(/^- (.+)$/gm, '<li style="margin-left: 1rem; color: #d1d5db; list-style-type: disc; list-style-position: inside; margin-bottom: 0.25rem;">$1</li>');
            html = html.replace(/^\d+\. (.+)$/gm, '<li style="margin-left: 1rem; color: #d1d5db; list-style-type: decimal; list-style-position: inside; margin-bottom: 0.25rem;">$1</li>');

            html = html.replace(/`([^`]+)`/g, '<code style="background: #374151; color: #86efac; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; font-family: monospace;">$1</code>');

            html = html.replace(/\*\*(.+?)\*\*/g, '<strong style="color: #ffffff; font-weight: 600;">$1</strong>');

            html = html.replace(/\n\n/g, '<br/><br/>');

            return html;
        }

        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [currentModule, setCurrentModule] = useState(0);
            const [currentLesson, setCurrentLesson] = useState(0);
            const [completedLessons, setCompletedLessons] = useState(() => {
                const saved = localStorage.getItem('pylearn_completed');
                return saved ? new Set(JSON.parse(saved)) : new Set();
            });
            const [userCode, setUserCode] = useState('');
            const [showHint, setShowHint] = useState(false);
            const [testResults, setTestResults] = useState([]);
            const [sidebarOpen, setSidebarOpen] = useState(false);

            useEffect(() => {
                localStorage.setItem('pylearn_completed', JSON.stringify([...completedLessons]));
            }, [completedLessons]);

            const totalLessons = modules.reduce((acc, m) => acc + m.lessons.length, 0);
            const progress = Math.round((completedLessons.size / totalLessons) * 100);

            const openLesson = useCallback((moduleIdx, lessonIdx) => {
                setCurrentModule(moduleIdx);
                setCurrentLesson(lessonIdx);
                setCurrentView('lesson');
                setSidebarOpen(false);
                window.scrollTo(0, 0);
            }, []);

            const openExercise = useCallback(() => {
                const lesson = modules[currentModule].lessons[currentLesson];
                if (lesson.exercise) {
                    setUserCode(lesson.exercise.starterCode);
                    setTestResults([]);
                    setShowHint(false);
                    setCurrentView('exercise');
                }
            }, [currentModule, currentLesson]);

            const runTests = useCallback(() => {
                const lesson = modules[currentModule].lessons[currentLesson];
                if (!lesson.exercise) return;

                const results = lesson.exercise.tests.map(test => ({
                    passed: test.check(userCode),
                    message: test.description,
                }));
                setTestResults(results);

                if (results.every(r => r.passed)) {
                    const lessonId = lesson.id;
                    setCompletedLessons(prev => new Set([...prev, lessonId]));
                }
            }, [currentModule, currentLesson, userCode]);

            const markComplete = useCallback(() => {
                const lesson = modules[currentModule].lessons[currentLesson];
                setCompletedLessons(prev => new Set([...prev, lesson.id]));
            }, [currentModule, currentLesson]);

            const nextLesson = useCallback(() => {
                const module = modules[currentModule];
                if (currentLesson < module.lessons.length - 1) {
                    openLesson(currentModule, currentLesson + 1);
                } else if (currentModule < modules.length - 1) {
                    openLesson(currentModule + 1, 0);
                } else {
                    setCurrentView('home');
                }
            }, [currentModule, currentLesson, openLesson]);

            const prevLesson = useCallback(() => {
                if (currentLesson > 0) {
                    openLesson(currentModule, currentLesson - 1);
                } else if (currentModule > 0) {
                    const prevModule = modules[currentModule - 1];
                    openLesson(currentModule - 1, prevModule.lessons.length - 1);
                }
            }, [currentModule, currentLesson, openLesson]);

            const currentModuleData = modules[currentModule];
            const currentLessonData = currentModuleData?.lessons[currentLesson];
            const isCompleted = currentLessonData ? completedLessons.has(currentLessonData.id) : false;

            return (
                <div className="min-h-screen bg-gray-900 text-gray-100">
                    {/* Header */}
                    <header className="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <button
                                    onClick={() => setSidebarOpen(!sidebarOpen)}
                                    className="lg:hidden p-2 hover:bg-gray-700 rounded-lg transition-colors"
                                >
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                    </svg>
                                </button>
                                <button onClick={() => setCurrentView('home')} className="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                    <span className="text-2xl">🐍</span>
                                    <span className="text-xl font-bold bg-gradient-to-r from-green-400 to-blue-500 bg-clip-text text-transparent">
                                        PyLearn
                                    </span>
                                </button>
                            </div>

                            <div className="flex items-center gap-4">
                                <div className="hidden sm:flex items-center gap-3">
                                    <div className="w-32 bg-gray-700 rounded-full h-2.5">
                                        <div
                                            className="bg-gradient-to-r from-green-400 to-blue-500 h-2.5 rounded-full transition-all duration-500"
                                            style={{ width: `${progress}%` }}
                                        />
                                    </div>
                                    <span className="text-sm text-gray-400">{progress}%</span>
                                </div>
                                <div className="flex items-center gap-1 bg-gray-700 px-3 py-1.5 rounded-full">
                                    <span className="text-yellow-400">🔥</span>
                                    <span className="text-sm font-medium">{completedLessons.size}/{totalLessons}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="flex">
                        {/* Sidebar */}
                        <aside className={`fixed lg:sticky top-[57px] left-0 h-[calc(100vh-57px)] w-72 bg-gray-800 border-r border-gray-700 overflow-y-auto transform transition-transform duration-300 z-40 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>

                                                            )}

                                                        </div>

                                ))}

                        {sidebarOpen && (

                    <div className="flex items-center gap-2 text-sm text-gray-500 mb-6">
                        <span>{moduleIcon}</span>
                        <span>{moduleTitle}</span>
                        <span>/</span>
                        <span className="text-gray-300">{lesson.title}</span>
                    </div>

                    <div className="flex items-center gap-2 mb-6">
                        <span className="text-xs text-gray-500">
                            Модуль {moduleIdx + 1}/{totalModules} • Урок {lessonIdx + 1}/{totalLessonsInModule}
                        </span>
                    </div>

                    <h1 className="text-3xl font-bold text-white mb-8">{lesson.title}</h1>

                    <div
                        className="prose prose-invert max-w-none lesson-content"
                        dangerouslySetInnerHTML={{ __html: renderMarkdown(lesson.content) }}
                    />

                    {lesson.code && (
                        <div className="mt-8">
                            <h3 className="text-lg font-semibold text-gray-200 mb-3 flex items-center gap-2">
                                <span>💻</span> Интерактивный пример
                            </h3>
                            <div className="rounded-xl overflow-hidden border border-gray-700">
                                <div className="bg-gray-800 px-4 py-2 flex items-center gap-2">
                                    <span className="w-3 h-3 rounded-full bg-red-500"></span>
                                    <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                                    <span className="w-3 h-3 rounded-full bg-green-500"></span>
                                    <span className="ml-2 text-sm text-gray-400">example.py</span>
                                </div>
                                <pre className="bg-gray-900 p-4 overflow-x-auto text-sm leading-relaxed">
                                    <code dangerouslySetInnerHTML={{ __html: highlightPython(lesson.code) }} />
                                </pre>
                            </div>
                        </div>
                    )}

                    <div className="mt-10 flex flex-wrap items-center gap-4">
                        {!isCompleted && (
                            <button
                                onClick={markComplete}
                                className="px-6 py-3 bg-green-600 hover:bg-green-700 text-white rounded-lg font-medium transition-colors flex items-center gap-2"
                            >
                                <span>✓</span> Отметить как пройденный
                            </button>
                        )}
                        {isCompleted && (
                            <span className="px-4 py-2 bg-green-600/20 text-green-400 rounded-lg border border-green-600/30 flex items-center gap-2">
                                <span>✓</span> Пройдено
                            </span>
                        )}
                        {hasExercise && (
                            <button
                                onClick={openExercise}
                                className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors flex items-center gap-2"
                            >
                                <span>🏋️</span> Практика
                            </button>
                        )}
                    </div>

                    <div className="mt-12 pt-8 border-t border-gray-700 flex justify-between">
                        <button
                            onClick={prevLesson}
                            disabled={moduleIdx === 0 && lessonIdx === 0}
                            className="px-4 py-2 bg-gray-700 hover:bg-gray-600 disabled:opacity-30 disabled:cursor-not-allowed rounded-lg transition-colors flex items-center gap-2"
                        >
                            <span>←</span> Назад
                        </button>
                        <button
                            onClick={nextLesson}
                            className="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors flex items-center gap-2"
                        >
                            Далее <span>→</span>
                        </button>
                    </div>
                </div>
            );
        }

        function ExercisePage({ exercise, userCode, setUserCode, testResults, showHint, setShowHint, runTests, onBack }) {
            const allPassed = testResults.length > 0 && testResults.every(r => r.passed);

            return (
                <div className="max-w-5xl mx-auto px-4 py-8">
                    <button onClick={onBack} className="mb-6 text-gray-400 hover:text-gray-200 flex items-center gap-2 transition-colors">
                        <span>←</span> Вернуться к уроку
                    </button>

                    <div className="grid lg:grid-cols-2 gap-6">
                        <div>
                            <h2 className="text-2xl font-bold text-white mb-4 flex items-center gap-2">
                                <span>🏋️</span> Практическое задание
                            </h2>
                            <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                                <p className="text-gray-300 leading-relaxed mb-6">{exercise.description}</p>

                                <div className="space-y-2 mb-6">
                                    <h4 className="text-sm font-medium text-gray-400 mb-2">Тесты:</h4>
                                    {exercise.tests.map((test, i) => {
                                        const result = testResults[i];
                                        return (
                                            <div key={i} className={`flex items-center gap-2 text-sm p-2 rounded ${
                                                result ? (result.passed ? 'bg-green-900/30 text-green-400' : 'bg-red-900/30 text-red-400') : 'bg-gray-700/50 text-gray-400'
                                            }`}>
                                                <span>{result ? (result.passed ? '✅' : '❌') : '⬜'}</span>
                                                <span>{test.description}</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div>
                                    {!showHint ? (
                                        <button
                                            onClick={() => setShowHint(true)}
                                            className="text-sm text-yellow-400 hover:text-yellow-300 flex items-center gap-1"
                                        >
                                            💡 Показать подсказку
                                        </button>
                                    ) : (
                                        <div className="bg-yellow-900/20 border border-yellow-700/50 rounded-lg p-3">
                                            <p className="text-sm text-yellow-300">💡 {exercise.hint}</p>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {allPassed && (
                                <div className="mt-4 bg-green-900/30 border border-green-600/50 rounded-xl p-4 text-center">
                                    <span className="text-3xl mb-2 block">🎉</span>
                                    <p className="text-green-400 font-semibold">Отлично! Все тесты пройдены!</p>
                                </div>
                            )}
                        </div>

                        <div>
                            <div className="rounded-xl overflow-hidden border border-gray-700">
                                <div className="bg-gray-800 px-4 py-2 flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <span className="w-3 h-3 rounded-full bg-red-500"></span>
                                        <span className="w-3 h-3 rounded-full bg-yellow-500"></span>
                                        <span className="w-3 h-3 rounded-full bg-green-500"></span>
                                        <span className="ml-2 text-sm text-gray-400">solution.py</span>
                                    </div>
                                    <button
                                        onClick={runTests}
                                        className="px-3 py-1 bg-green-600 hover:bg-green-700 text-white text-sm rounded transition-colors"
                                    >
                                        ▶ Запустить
                                    </button>
                                </div>
                                <textarea
                                    value={userCode}
                                    onChange={(e) => setUserCode(e.target.value)}
                                    className="w-full h-80 bg-gray-900 text-gray-100 p-4 font-mono text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-500/50"
                                    spellCheck={false}
                                    placeholder="# Напишите ваш код здесь..."
                                />
                            </div>

                            <div className="mt-4">
                                <details className="group">
                                    <summary className="cursor-pointer text-sm text-gray-400 hover:text-gray-200 transition-colors">
                                        👀 Показать решение
                                    </summary>
                                    <div className="mt-2 rounded-lg overflow-hidden border border-gray-700">
                                        <pre className="bg-gray-900 p-4 overflow-x-auto text-sm">
                                            <code dangerouslySetInnerHTML={{ __html: highlightPython(exercise.solution) }} />
                                        </pre>
                                    </div>
                                </details>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function HomePage({ progress, completedCount, totalLessons, modules: mods, completedLessons, onStartLesson }) {
            return (
                <div className="max-w-5xl mx-auto px-4 py-12">
                    <div className="text-center mb-16">
                        <div className="text-6xl mb-6">🐍</div>
                        <h1 className="text-4xl md:text-5xl font-bold mb-4">
                            <span className="bg-gradient-to-r from-green-400 via-blue-400 to-purple-500 bg-clip-text text-transparent">
                                Бесплатный курс Python
                            </span>
                        </h1>
                        <p className="text-xl text-gray-400 max-w-2xl mx-auto mb-8">
                            Изучите Python с нуля — от базовых переменных до продвинутых тем.
                            Интерактивные уроки, примеры кода и практические задания.
                        </p>

                        <div className="flex flex-wrap justify-center gap-6 mb-8">
                            <div className="bg-gray-800 rounded-xl px-6 py-4 border border-gray-700">
                                <div className="text-2xl font-bold text-green-400">{mods.length}</div>
                                <div className="text-sm text-gray-400">Модулей</div>
                            </div>
                            <div className="bg-gray-800 rounded-xl px-6 py-4 border border-gray-700">
                                <div className="text-2xl font-bold text-blue-400">{totalLessons}</div>
                                <div className="text-sm text-gray-400">Уроков</div>
                            </div>
                            <div className="bg-gray-800 rounded-xl px-6 py-4 border border-gray-700">
                                <div className="text-2xl font-bold text-purple-400">{completedCount}</div>
                                <div className="text-sm text-gray-400">Пройдено</div>
                            </div>
                        </div>

                        <div className="max-w-md mx-auto">
                            <div className="flex justify-between text-sm text-gray-400 mb-2">
                                <span>Прогресс курса</span>
                                <span>{progress}%</span>
                            </div>
                            <div className="w-full bg-gray-700 rounded-full h-3">
                                <div
                                    className="bg-gradient-to-r from-green-400 to-blue-500 h-3 rounded-full transition-all duration-700"
                                    style={{ width: `${progress}%` }}
                                />
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-2 gap-6">
                        {mods.map((module, mIdx) => {
                            const moduleCompleted = module.lessons.filter(l => completedLessons.has(l.id)).length;
                            const moduleProgress = Math.round((moduleCompleted / module.lessons.length) * 100);
                            const isModuleComplete = moduleCompleted === module.lessons.length;

                            return (
                                <div
                                    key={module.id}
                                    className={`bg-gray-800 rounded-xl p-6 border transition-all hover:border-gray-500 hover:shadow-lg ${
                                        isModuleComplete ? 'border-green-600/50' : 'border-gray-700'
                                    }`}
                                >
                                    <div className="flex items-start justify-between mb-4">
                                        <div className="flex items-center gap-3">
                                            <span className="text-3xl">{module.icon}</span>
                                            <div>
                                                <h3 className="text-lg font-semibold text-white">{module.title}</h3>
                                                <p className="text-sm text-gray-400">{module.lessons.length} уроков</p>
                                            </div>
                                        </div>
                                        {isModuleComplete && <span className="text-green-400 text-xl">✓</span>}
                                    </div>

                                    <div className="mb-4">
                                        <div className="w-full bg-gray-700 rounded-full h-1.5">
                                            <div
                                                className="bg-gradient-to-r from-green-400 to-blue-500 h-1.5 rounded-full transition-all"
                                                style={{ width: `${moduleProgress}%` }}
                                            />
                                        </div>
                                    </div>

                                    <div className="space-y-1">
                                        {module.lessons.map((lesson, lIdx) => {
                                            const isDone = completedLessons.has(lesson.id);
                                            return (
                                                <button
                                                    key={lesson.id}
                                                    onClick={() => onStartLesson(mIdx, lIdx)}
                                                    className="w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-gray-700 transition-colors flex items-center gap-2"
                                                >
                                                    {isDone ? (
                                                        <span className="text-green-400 text-xs flex-shrink-0">✅</span>
                                                    ) : (
                                                        <span className="text-gray-600 text-xs flex-shrink-0">○</span>
                                                    )}
                                                    <span className={`${isDone ? 'text-gray-300' : 'text-gray-400'}`}>
                                                        {lesson.title}
                                                    </span>
                                                    {lesson.exercise && (
                                                        <span className="ml-auto text-xs bg-blue-600/20 text-blue-400 px-1.5 py-0.5 rounded">
                                                            задача
                                                        </span>
                                                    )}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    <button
                                        onClick={() => onStartLesson(mIdx, 0)}
                                        className="mt-4 w-full py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm font-medium transition-colors"
                                    >
                                        {moduleCompleted === 0 ? '🚀 Начать модуль' : '📖 Продолжить'}
                                    </button>
                                </div>
                            );
                        })}
                    </div>

                    <div className="mt-16 text-center text-gray-500 text-sm">
                        <p>PyLearn — бесплатная платформа для изучения Python</p>
                        <p className="mt-1">Создано с ❤️ для начинающих программистов</p>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
