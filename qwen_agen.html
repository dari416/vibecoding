<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyCamp — полный курс Python в браузере</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23231D10'/%3E%3Cpath d='M8 11l6 5-6 5' stroke='%23F3EDDD' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M17 22h8' stroke='%23C2481B' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<style>
  :root{
    --paper:#F3EDDD; --paper-2:#EAE2CC; --paper-3:#E0D6BA;
    --ink:#231D10; --ink-2:#5F563F; --ink-3:#8B8163;
    --accent:#C2481B; --accent-2:#9E380F;
    --green:#2C7A4B; --red:#A93226;
    --code-bg:#191510; --code-panel:#241E15; --code-line:#3A3223;
    --code-fg:#E8DFC8; --code-dim:#93876B;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font:16px/1.55 var(--sans); display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:radial-gradient(var(--ink) 1px, transparent 1.2px);
    background-size:26px 26px; opacity:.04;
  }
  ::selection{background:var(--accent); color:var(--paper)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#C6BBA0;border:2px solid var(--paper)}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  #app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1}
  .screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:rise .35s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  body.mode-challenge{overflow:hidden}

  /* ---------- кнопки ---------- */
  .btn{
    font:600 12px/1 var(--mono); letter-spacing:.07em; text-transform:uppercase;
    padding:12px 16px; border:1.5px solid var(--ink); background:var(--paper); color:var(--ink);
    cursor:pointer; display:inline-flex; gap:9px; align-items:center; justify-content:center;
    box-shadow:3px 3px 0 var(--ink); transition:transform .12s, box-shadow .12s, background .12s;
    user-select:none;
  }
  .btn:hover{transform:translate(-1px,-1px); box-shadow:4px 4px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink)}
  .btn.primary{background:var(--accent); color:#FFF6E9}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.danger{background:var(--red); color:#FFF6E9}
  .btn.ghost{box-shadow:none; background:transparent; color:var(--ink-2)}
  .btn.ghost:hover{background:var(--paper-2); transform:none}
  .btn.small{padding:8px 11px; box-shadow:2px 2px 0 var(--ink)}
  .btn.small.ghost{box-shadow:none}
  .btn:disabled{opacity:.45; pointer-events:none}
  .btn.loading svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .link{background:none;border:none;cursor:pointer;color:var(--code-dim);font:11px var(--mono);text-transform:uppercase;letter-spacing:.1em;padding:4px 6px}
  .link:hover{color:var(--code-fg)}

  /* ---------- верхняя панель ---------- */
  .topbar{
    position:sticky; top:0; z-index:40; flex:none;
    display:flex; align-items:center; gap:16px;
    padding:0 20px; height:58px; background:var(--paper);
    border-bottom:1.5px solid var(--ink);
  }
  .logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:700 19px var(--sans);letter-spacing:-.01em}
  .logo-sub{font:11px var(--mono); color:var(--ink-3); letter-spacing:.08em; text-transform:uppercase; margin-left:2px}
  .crumb{font:14px var(--sans); color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .crumb b{color:var(--ink)}
  .crumb .sep{color:var(--ink-3); margin:0 6px}
  .tb-spacer{flex:1}
  .pill{display:flex;align-items:center;gap:10px;font:600 12px var(--mono)}
  .pill-bar{width:110px;height:10px;border:1.5px solid var(--ink);background:var(--paper-2);display:block}
  .pill-bar i{display:block;height:100%;background:var(--green);transition:width .4s ease}

  /* ---------- главная ---------- */
  .hero{
    display:grid; grid-template-columns:1.05fr .95fr; gap:52px; align-items:center;
    padding:58px clamp(20px,6vw,90px) 52px; border-bottom:1.5px solid var(--ink);
  }
  .meta-line{font:11px var(--mono); letter-spacing:.2em; color:var(--ink-2); display:flex; align-items:center; gap:10px; margin-bottom:22px}
  .meta-line .sq{width:9px;height:9px;background:var(--accent);display:inline-block}
  .hero h1{font:700 clamp(40px,5.2vw,72px)/1.03 var(--sans); letter-spacing:-.03em; margin:0 0 22px}
  .hero h1 em{font-style:normal; color:var(--accent)}
  .lead{font-size:17px; color:var(--ink-2); max-width:52ch; margin:0 0 30px}
  .hero-actions{display:flex; align-items:center; gap:22px; flex-wrap:wrap}
  .hero-stats{font:13px var(--mono); color:var(--ink-2)}
  .hero-stats b{font-size:19px; color:var(--ink)}

  .term{
    background:var(--code-bg); border:1.5px solid var(--ink);
    box-shadow:8px 8px 0 var(--ink); color:var(--code-fg);
  }
  .term-bar{
    display:flex; align-items:center; gap:7px; padding:9px 14px;
    background:var(--code-panel); border-bottom:1px solid var(--code-line);
  }
  .term-bar i{width:9px;height:9px;border:1.5px solid var(--code-dim);border-radius:50%}
  .term-bar span{margin-left:8px;font:11px var(--mono);color:var(--code-dim);letter-spacing:.06em}
  .term-body{margin:0;padding:20px 22px;font:13.5px/1.9 var(--mono);min-height:220px;white-space:pre-wrap;word-break:break-word}
  .tl .tp{color:#6E6450}
  .tl.cmd .tt{color:#E89066}
  .tl.out .tt{color:#9CC08A}
  .caret{display:inline-block;width:9px;height:15px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---------- карта курса ---------- */
  .track{width:100%; max-width:1280px; margin:0 auto; padding:6px clamp(20px,6vw,90px) 30px}
  .module{padding:34px 0 8px}
  .module-head{display:flex; align-items:center; gap:16px; border-bottom:1.5px solid var(--ink); padding-bottom:12px; margin-bottom:4px}
  .module-no{font:700 14px var(--mono); color:var(--accent); border:1.5px solid var(--ink); background:var(--paper-2); padding:7px 10px; letter-spacing:.1em}
  .module-title{font:700 25px var(--sans); letter-spacing:-.01em}
  .module-count{margin-left:auto; font:12px var(--mono); color:var(--ink-3); letter-spacing:.08em}
  .ch-list{position:relative; margin-left:5px}
  .ch-list::before{content:""; position:absolute; left:10px; top:16px; bottom:16px; border-left:2px solid rgba(35,29,16,.22)}
  .ch{
    display:grid; grid-template-columns:22px 40px 1fr auto; gap:14px; align-items:center;
    width:100%; text-align:left; padding:13px 10px 13px 0; border:none; background:none;
    cursor:pointer; color:var(--ink); position:relative; transition:background .12s;
  }
  .ch:hover{background:rgba(35,29,16,.06)}
  .ch .dot{
    width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;
    background:var(--paper); justify-self:center; z-index:1; transition:background .2s,border-color .2s;
  }
  .ch.solved .dot{background:var(--green); border-color:var(--green)}
  .ch.next .dot{border-color:var(--accent); animation:pulse 1.7s infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(194,72,27,.4)}
    70%{box-shadow:0 0 0 9px rgba(194,72,27,0)}
    100%{box-shadow:0 0 0 0 rgba(194,72,27,0)}
  }
  .ch .no{font:600 12px var(--mono); color:var(--ink-3)}
  .ch .name{font:500 17px var(--sans)}
  .ch.next .name{font-weight:700}
  .ch .stat{font:12px var(--mono); color:var(--ink-3); display:flex; align-items:center; gap:6px}
  .ch.solved .stat{color:var(--green)}
  .ch.next .stat{color:var(--accent)}
  .ch.next .stat svg{transition:transform .15s}
  .ch:hover .stat svg{transform:translateX(3px)}

  /* ---------- сертификат ---------- */
  .cert{
    margin:38px 0 66px; border:1.5px solid var(--ink); background:var(--paper-2);
    box-shadow:6px 6px 0 var(--ink); padding:30px 34px;
    display:grid; grid-template-columns:auto 1fr auto; gap:26px; align-items:center;
  }
  .cert-ico{color:var(--accent)}
  .cert-main h2{margin:0 0 6px; font:700 24px var(--sans)}
  .cert-main p{margin:0; color:var(--ink-2); font-size:15px}
  .cert-side{display:flex; flex-direction:column; gap:10px; align-items:stretch; min-width:240px}
  .cert-side input{
    font:15px var(--mono); padding:11px 13px; border:1.5px solid var(--ink);
    background:var(--paper); color:var(--ink); outline:none;
  }
  .cert-side input:focus{border-color:var(--accent)}
  .cert-bar{width:240px; height:12px; border:1.5px solid var(--ink); background:var(--paper)}
  .cert-bar i{display:block; height:100%; background:var(--accent)}
  .foot{
    border-top:1.5px solid var(--ink); padding:22px clamp(20px,6vw,90px);
    font:12px/1.8 var(--mono); color:var(--ink-3); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }

  /* ---------- урок ---------- */
  .challenge{
    flex:1; min-height:0; display:grid;
    grid-template-columns:minmax(360px,42%) 1fr;
  }
  .brief{overflow-y:auto; border-right:1.5px solid var(--ink); padding:30px 34px 40px}
  .stamps{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap}
  .stamp{font:600 11px var(--mono); letter-spacing:.12em; text-transform:uppercase; border:1.5px solid var(--ink); padding:5px 9px; background:var(--paper-2)}
  .stamp.ghost{color:var(--ink-2); background:transparent}
  .brief h1{font:700 30px/1.15 var(--sans); letter-spacing:-.02em; margin:0 0 18px}
  .steps{list-style:none; margin:0; padding:0; counter-reset:s}
  .steps li{
    counter-increment:s; display:grid; grid-template-columns:28px 1fr; gap:12px;
    padding:11px 0; font-size:15.5px;
  }
  .steps li::before{
    content:counter(s,decimal-leading-zero); font:700 12px/22px var(--mono); color:var(--accent);
    border:1.5px solid var(--ink); text-align:center; height:24px; background:var(--paper);
  }
  code{
    font:600 .86em var(--mono); background:var(--paper-2); border:1px solid var(--paper-3);
    padding:1px 5px; white-space:nowrap;
  }
  .note{border-left:3px solid var(--accent); background:var(--paper-2); padding:12px 16px; font-size:14.5px; color:var(--ink-2); margin:14px 0}
  .hint{margin:16px 0; border:1.5px dashed var(--accent)}
  .hint summary{
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;
    padding:10px 14px; font:600 12px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--accent);
  }
  .hint summary::-webkit-details-marker{display:none}
  .hint-body{padding:2px 14px 12px; font-size:14.5px; color:var(--ink-2); border-top:1px dashed rgba(194,72,27,.4); padding-top:10px}
  .brief-nav{display:flex; justify-content:space-between; gap:10px; margin-top:26px}

  .workbench{display:flex; flex-direction:column; min-width:0; min-height:0}
  .toolbar{flex:none; display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1.5px solid var(--ink); background:var(--paper-2); flex-wrap:wrap}
  .kbd{margin-left:auto; font:11px var(--mono); color:var(--ink-3)}
  .editor-wrap{flex:1; min-height:0; background:var(--code-bg)}
  .editor-wrap > div{height:100%}
  .CodeMirror{height:100%; background:var(--code-bg); color:var(--code-fg); font:14px/1.65 var(--mono); padding:12px 8px}
  .CodeMirror-gutters{background:var(--code-bg); border-right:1px solid var(--code-line)}
  .CodeMirror-linenumber{color:#5E5540}
  .cm-s-pycamp .cm-keyword{color:#FF8F63; font-weight:600}
  .cm-s-pycamp .cm-string{color:#A9C97E}
  .cm-s-pycamp .cm-number{color:#E8C56A}
  .cm-s-pycamp .cm-comment{color:#877B66; font-style:italic}
  .cm-s-pycamp .cm-def{color:#F0E3C2}
  .cm-s-pycamp .cm-builtin{color:#7FBFAD}
  .cm-s-pycamp .cm-atom{color:#DD9F6B}
  .cm-s-pycamp .cm-operator{color:#D8CFBB}
  .cm-s-pycamp .cm-variable{color:#EDE4D4}
  .cm-s-pycamp .cm-variable-2{color:#C8B98F}
  .cm-s-pycamp .CodeMirror-cursor{border-left:2px solid #FF8F63}
  .cm-s-pycamp .CodeMirror-selected{background:#3A3226}
  .cm-s-pycamp .CodeMirror-activeline-background{background:#211C15}
  .cm-s-pycamp .CodeMirror-matchingbracket{color:#FFD98A !important; outline:1px solid #6E6450}
  .ta-fallback{width:100%;height:100%;background:var(--code-bg);color:var(--code-fg);border:0;resize:none;font:14px/1.65 var(--mono);padding:16px;outline:none}

  .console{flex:none; height:36%; min-height:180px; display:flex; flex-direction:column; background:#12100C; border-top:1.5px solid var(--ink)}
  .console-bar{flex:none; display:flex; align-items:center; gap:10px; padding:7px 14px; border-bottom:1px solid var(--code-line); color:var(--code-dim); font:11px var(--mono); text-transform:uppercase; letter-spacing:.12em}
  .console-body{flex:1; overflow:auto; padding:12px 16px 16px; font:13px/1.7 var(--mono); color:#D8CFBB; white-space:pre-wrap; word-break:break-word}
  .console-empty{color:#6E6450; font-style:italic}
  .out{color:#D8CFBB}
  .err{display:flex; gap:10px; align-items:baseline; color:#FF7A5C; margin:8px 0}
  .err-tag, .tests-head{flex:none; font-size:10px; letter-spacing:.12em; text-transform:uppercase; border:1px solid #6E3126; color:#FF7A5C; padding:2px 7px}
  .blocked{color:#C9A94E; font-style:italic; margin-top:8px}
  .tests-head{margin:14px 0 6px; color:#A9C97E; border-color:#2E5C43}
  .test{display:flex; gap:10px; padding:8px 10px; border:1px solid var(--code-line); margin:5px 0; align-items:flex-start; white-space:normal}
  .test .ti{flex:none; margin-top:3px}
  .test.ok{border-color:#2E5C43}
  .test.ok .ti{color:#7FC79A}
  .test.fail{border-color:#6E3126}
  .test.fail .ti{color:#FF7A5C}
  .test b{font-weight:600; font-size:13px}
  .test em{display:block; font-style:normal; color:#FF9B82; font-size:12.5px; margin-top:3px}
  .success{
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    border:1.5px solid #3E7B57; background:#18251C; padding:13px 16px; margin-top:12px;
    animation:rise .3s ease;
  }
  .success b{color:#B9E3C6; font:600 14px var(--sans); display:block}
  .success span{color:#7FA98C; font-size:12.5px}

  /* ---------- тосты, модалка, загрузчик ---------- */
  #toasts{position:fixed; right:18px; bottom:18px; z-index:120; display:flex; flex-direction:column; gap:10px}
  .toast{
    background:var(--ink); color:var(--paper); padding:12px 16px; font:13px var(--mono);
    border-left:4px solid var(--accent); box-shadow:4px 4px 0 rgba(35,29,16,.28);
    display:flex; align-items:center; gap:8px; animation:tin .25s ease; max-width:340px;
  }
  .toast.ok{border-left-color:var(--green)}
  .toast.hide{opacity:0; transform:translateX(10px); transition:.3s}
  @keyframes tin{from{opacity:0; transform:translateY(8px)}}

  .overlay{
    position:fixed; inset:0; z-index:100; background:rgba(35,29,16,.5);
    display:flex; align-items:center; justify-content:center; padding:20px;
    animation:tin .2s ease;
  }
  .overlay[hidden]{display:none}
  .boot-card,.modal{
    background:var(--paper); border:1.5px solid var(--ink); box-shadow:8px 8px 0 var(--ink);
    padding:28px 30px; width:100%; max-width:460px; animation:rise .25s ease;
  }
  .boot-title{font:700 19px var(--sans); margin-bottom:4px}
  .boot-sub{font:12px var(--mono); color:var(--ink-3); margin-bottom:16px}
  .boot-log{font:12.5px/1.9 var(--mono); color:var(--ink-2); min-height:120px; margin-bottom:14px}
  .boot-log .done{color:var(--green); font-weight:600}
  .boot-log div::before{content:"» "; color:var(--accent)}
  .boot-spin{width:22px;height:22px;border:2.5px solid var(--paper-3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  .modal h3{margin:0 0 10px; font:700 20px var(--sans)}
  .modal p{margin:0 0 20px; color:var(--ink-2); font-size:15px}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px}

  /* ---------- адаптив ---------- */
  @media (max-width:1060px){
    .challenge{grid-template-columns:minmax(320px,44%) 1fr}
  }
  @media (max-width:960px){
    body.mode-challenge{overflow:auto}
    .hero{grid-template-columns:1fr; gap:36px; padding-top:40px}
    .challenge{grid-template-columns:1fr; height:auto}
    .brief{border-right:none; border-bottom:1.5px solid var(--ink); overflow:visible}
    .editor-wrap{height:440px; flex:none}
    .console{height:320px}
    .kbd{display:none}
    .crumb{display:none}
    .logo-sub{display:none}
    .cert{grid-template-columns:1fr}
    .cert-side{min-width:0}
    .ch .stat i{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<div id="modal-root"></div>

<!-- Оверлей первой загрузки рантайма -->
<div id="boot-overlay" class="overlay" hidden>
  <div class="boot-card">
    <div class="boot-title">Первый запуск Python-рантайма</div>
    <div class="boot-sub">CPython 3.12 · WebAssembly · один раз за сессию</div>
    <div class="boot-log" id="boot-log"></div>
    <div class="boot-spin"></div>
  </div>
</div>

<script>
/* ================================================================
   PyCamp — открытый курс Python в одном файле.
   Код исполняется настоящим CPython (Pyodide/WASM) в воркере.
   ================================================================ */

/* ---------- иконки (инлайновые SVG) ---------- */
const ICONS = {
  play:   '<path d="M7 5v14l12-7z" fill="currentColor" stroke="none"/>',
  check:  '<path d="M20 6L9 17l-5-5"/>',
  x:      '<path d="M18 6L6 18M6 6l12 12"/>',
  left:   '<path d="M19 12H5m7 7l-7-7 7-7"/>',
  right:  '<path d="M5 12h14m-7-7l7 7-7 7"/>',
  bulb:   '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4.2 12.6c.7.6 1.2 1.5 1.2 2.4h6c0-.9.5-1.8 1.2-2.4A7 7 0 0 0 12 2z"/>',
  reset:  '<path d="M3 12a9 9 0 1 0 9-9 9.7 9.7 0 0 0-6.7 2.7L3 8M3 3v5h5"/>',
  term:   '<path d="M4 17l6-5-6-5M12 19h8"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  award:  '<circle cx="12" cy="8" r="6"/><path d="M15.5 13L17 22l-5-3-5 3 1.5-9"/>',
  map:    '<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/>'
};
const icon = (n, s = 14) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

import io, json, os, contextlib

def _run_user(src, tests_json, stdin_json, files_json):
    tests = json.loads(tests_json)
    stdin_vals = json.loads(stdin_json)
    files = json.loads(files_json)
    for name, content in files.items():
        path = os.path.join('/home/pydide', name)
        d = os.path.dirname(path)
        if d:
            os.makedirs(d, exist_ok=True)
        with open(path, 'w', encoding='utf-8') as f:
            f.write(content)
    ns = {'__name__': '__main__'}
    _inputs = list(stdin_vals)
    def _fake_input(prompt=''):
        if prompt:
            print(prompt, end='')
        if not _inputs:
            raise EOFError('input(): заготовленные строки ввода закончились')
        v = _inputs.pop(0)
        print(v)
        return v
    ns['input'] = _fake_input
    buf = io.StringIO()
    err = None
    try:
        with contextlib.redirect_stdout(buf):
            code = compile(src, '<ваш код>', 'exec')
            exec(code, ns)
    except BaseException as e:
        line = getattr(e, 'lineno', None)
        tb = e.__traceback__
        while tb is not None:
            if tb.tb_frame.f_code.co_filename == '<ваш код>':
                line = tb.tb_lineno
            tb = tb.tb_next
        err = {'type': type(e).__name__, 'msg': str(e), 'line': line}
    out = buf.getvalue()
    results = []
    if err is None:
        def _nl(s):
            return [l.strip() for l in s.strip().splitlines() if l.strip()]
        g2 = dict(ns)
        g2['OUT'] = out
        g2['SRC'] = src
        g2['_nl'] = _nl
        for t in tests:
            tg = dict(g2)
            ok = True
            msg = ''
            try:
                exec(compile(t['code'], '<test>', 'exec'), tg)
            except AssertionError as e:
                ok = False
                msg = str(e) or ('Проверка не пройдена: ' + t['title'])
            except BaseException as e:
                ok = False
                msg = type(e).__name__ + ': ' + str(e)
            results.append({'title': t['title'], 'ok': ok, 'msg': msg})
    return json.dumps({'out': out, 'err': err, 'tests': results}, ensure_ascii=False)
`.trim();

const ALL = [];
MODULES.forEach(m => m.challenges.forEach(c => { c.module = m; ALL.push(c); }));

/* ---------- состояние ---------- */
const KEY = 'pycamp-state-v1';
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object') return { solved: s.solved || {}, code: s.code || {}, name: s.name || '' };
  }catch(e){}
  return { solved:{}, code:{}, name:'' };
}
let state = loadState();
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };
const solvedCount = () => ALL.filter(c => state.solved[c.id]).length;
const nextChallenge = () => ALL.find(c => !state.solved[c.id]) || null;
const go = id => { location.hash = '#/c/' + id; };

/* ---------- рантайм Python ---------- */
const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/';
const WORKER_SRC = `
let pyodide = null, runner = null;
self.onmessage = async (ev) => {
  const m = ev.data;
  if (m.type !== 'run') return;
  try {
    if (!pyodide) {
      importScripts('${PYODIDE_URL}pyodide.js');
      pyodide = await loadPyodide({ indexURL: '${PYODIDE_URL}' });
      pyodide.runPython(${JSON.stringify(PROLOG)});
      runner = pyodide.globals.get('_run_user');
      self.postMessage({ type: 'ready' });
    }
    if (!runner) runner = pyodide.globals.get('_run_user');
    const payload = runner(m.code, JSON.stringify(m.tests || []), JSON.stringify(m.stdin || []), JSON.stringify(m.files || {}));
    self.postMessage({ type: 'result', id: m.id, payload: String(payload) });
  } catch (e) {
    self.postMessage({ type: 'result', id: m.id, error: String(e && e.message || e) });
  }
};`;

let runtime = null, runtimeReadyEver = false, jobSeq = 0;
const jobs = new Map();
let bootLogTimer = null, bootShown = false;

function failAll(err){
  jobs.forEach(j => { clearTimeout(j.timer); j.reject(err); });
  jobs.clear();
}

function getRuntime(){
  if (runtime) return runtime;
  let w = null;
  try{
    const blob = new Blob([WORKER_SRC], { type:'text/javascript' });
    w = new Worker(URL.createObjectURL(blob));
  }catch(e){ w = null; }
  if (w){
    w.onmessage = ev => {
      const m = ev.data;
      if (m.type === 'ready'){ return; }
      if (m.type === 'result' && jobs.has(m.id)){
        const j = jobs.get(m.id);
        jobs.delete(m.id);
        clearTimeout(j.timer);
        if (m.error) j.reject(new Error(m.error));
        else { try{ j.resolve(JSON.parse(m.payload)); } catch(e){ j.reject(new Error('Некорректный ответ рантайма')); } }
      }
    };
    w.onerror = () => {
      failAll(new Error('Ошибка рантайма Python. Проверьте подключение к сети и попробуйте ещё раз.'));
      try{ w.terminate(); }catch(e){}
      runtime = null;
      hideBoot(false);
    };
    runtime = { type:'worker', w };
  } else {
    runtime = { type:'main' };
  }
  return runtime;
}

let mainPy = null, mainLoad = null;
function ensureMain(){
  if (mainPy) return Promise.resolve();
  if (!mainLoad){
    mainLoad = (async () => {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = PYODIDE_URL + 'pyodide.js';
        s.onload = res;
        s.onerror = () => rej(new Error('не удалось загрузить pyodide.js'));
        document.head.appendChild(s);
      });
      mainPy = await loadPyodide({ indexURL: PYODIDE_URL });
      mainPy.runPython(PROLOG);
    })();
  }
  return mainLoad;
}

function pyRun(code, tests, stdin, files){
  return new Promise((resolve, reject) => {
    const rt = getRuntime();
    const id = ++jobSeq;
    const job = { resolve, reject, timer: 0 };
    job.timer = setTimeout(() => {
      jobs.delete(id);
      if (rt.type === 'worker' && runtime){ try{ rt.w.terminate(); }catch(e){} runtime = null; }
      reject(new Error('Код выполнялся дольше 20 секунд — возможно, в нём бесконечный цикл.'));
    }, 20000);
    jobs.set(id, job);
    showBootIfNeeded();
    if (rt.type === 'worker'){
      rt.w.postMessage({ type:'run', id, code, tests, stdin, files });
    } else {
      ensureMain().then(() => {
        const r = mainPy.globals.get('_run_user');
        const payload = r(code, JSON.stringify(tests), JSON.stringify(stdin || []), JSON.stringify(files || {}));
        const j = jobs.get(id);
        if (j){ clearTimeout(j.timer); jobs.delete(id); j.resolve(JSON.parse(String(payload))); }
      }).catch(e => {
        const j = jobs.get(id);
        if (j){ clearTimeout(j.timer); jobs.delete(id); }
        reject(new Error('Не удалось загрузить Python: ' + e.message));
      });
    }
  });
}

function showBootIfNeeded(){
  if (runtimeReadyEver || bootShown) return;
  bootShown = true;
  const ov = el('boot-overlay'), log = el('boot-log');
  ov.hidden = false;
  log.innerHTML = '';
  const lines = [
    'Проверяю окружение браузера…',
    'Загружаю CPython 3.12 (WebAssembly)…',
    'Разворачиваю стандартную библиотеку…',
    'Готовлю песочницу для кода…'
  ];
  let i = 0;
  bootLogTimer = setInterval(() => {
    if (i < lines.length){
      const d = document.createElement('div');
      d.textContent = lines[i++];
      log.appendChild(d);
    }
  }, 750);
}
function hideBoot(ok){
  if (!bootShown) return;
  clearInterval(bootLogTimer);
  const log = el('boot-log');
  const d = document.createElement('div');
  d.className = 'done';
  d.textContent = ok ? 'Готово.' : 'Не удалось.';
  log.appendChild(d);
  setTimeout(() => { el('boot-overlay').hidden = true; bootShown = false; }, 420);
}

/* ---------- тосты и модалка ---------- */
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.innerHTML = (kind === 'ok' ? icon('check', 13) : '') + '<span>' + esc(msg) + '</span>';
  el('toasts').appendChild(t);
  setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 350); }, 3400);
}
function confirmDlg(o){
  return new Promise(res => {
    el('modal-root').innerHTML =
      `<div class="overlay"><div class="modal">
        <h3>${o.title}</h3><p>${o.text}</p>
        <div class="modal-actions">
          <button class="btn small" id="m-cancel">${o.cancel || 'Отмена'}</button>
          <button class="btn small ${o.danger ? 'danger' : 'primary'}" id="m-ok">${o.ok}</button>
        </div></div></div>`;
    const close = v => { el('modal-root').innerHTML = ''; res(v); };
    el('m-ok').onclick = () => close(true);
    el('m-cancel').onclick = () => close(false);
    el('modal-root').querySelector('.overlay').onclick = e => { if (e.target.classList.contains('overlay')) close(false); };
  });
}

/* ---------- общие блоки ---------- */
function topbarHTML(opts = {}){

/* ---------- экран карты ---------- */
let mapPlayed = false;
const TERM_LINES = [
  { p:'$ ',    t:'python welcome.py',              c:'cmd' },
  { p:'>>> ',  t:'level = "новичок"',              c:'' },
  { p:'>>> ',  t:'for lesson in range(38):',       c:'' },
  { p:'... ',  t:'    level = practice(lesson)',   c:'' },
  { p:'>>> ',  t:'print(f"Итог курса: {level}")',  c:'' },
  { p:'',      t:'Итог курса: уверенный питонист', c:'out' }
];

function typewriter(){
  const body = el('term-body');
  if (!body) return;
  const instant = mapPlayed || matchMedia('(prefers-reduced-motion: reduce)').matches;
  mapPlayed = true;
  const lineHTML = l => `<div class="tl ${l.c}"><span class="tp">${esc(l.p)}</span><span class="tt">${esc(l.t)}</span></div>`;
  if (instant){
    body.innerHTML = TERM_LINES.map(lineHTML).join('') + '<span class="caret"></span>';
    return;
  }
  body.innerHTML = '<span class="caret"></span>';
  let li = 0, ci = 0;
  (function step(){
    if (!document.body.contains(body) || li >= TERM_LINES.length) return;
    const l = TERM_LINES[li];
    let lineEl = body.querySelector('[data-li="' + li + '"]');
    if (!lineEl){
      lineEl = document.createElement('div');
      lineEl.className = 'tl ' + l.c;
      lineEl.dataset.li = li;
      lineEl.innerHTML = `<span class="tp">${esc(l.p)}</span><span class="tt"></span>`;
      body.insertBefore(lineEl, body.querySelector('.caret'));
    }
    const tt = lineEl.querySelector('.tt');
    if (ci < l.t.length){
      tt.textContent += l.t[ci++];
      setTimeout(step, 14 + Math.random() * 26);
    } else {
      li++; ci = 0;
      setTimeout(step, 300);
    }
  })();
}

        <p class="lead">${total} практических уроков в ${MODULES.length} модулях. Настоящий CPython исполняется прямо во вкладке: вы пишете код — он сразу запускается и проверяется автотестами. Ничего устанавливать не нужно.</p>
        <div class="hero-actions">
          <button class="btn primary" id="hero-start">${icon('play', 12)} ${next ? (s ? 'Продолжить курс' : 'Начать курс') : 'Забрать сертификат'}</button>
          <div class="hero-stats"><b>${s}</b>/${total} <span>уроков сдано</span></div>
        </div>
      </div>
      <div>
        <div class="term">
          <div class="term-bar"><i></i><i></i><i></i><span>welcome.py — python 3.12 (wasm)</span></div>
          <pre class="term-body" id="term-body" aria-hidden="true"></pre>
        </div>
      </div>
    </header>
    <main class="track">
      ${MODULES.map(moduleHTML).join('')}
      <section class="cert" id="cert">
        <div class="cert-ico">${icon('award', 34)}</div>
        <div class="cert-main">
          <h2>Сертификат завершения</h2>
          <p>${certDone
            ? 'Поздравляем — весь курс пройден! Введите имя, как оно должно звучать в сертификате.'
            : `Пройдите все ${total} уроков, чтобы получить персональный сертификат. Осталось: ${total - s}.`}</p>

        <div class="cert-side">
          ${certDone
            ? `<input id="cert-name" placeholder="Ваше имя" value="${esc(state.name)}">
               <button class="btn primary" id="cert-dl">${icon('download', 13)} Скачать PNG</button>`

  typewriter();

/* ---------- экран урока ---------- */
let cm = null, taEl = null, busy = false;

function renderChallenge(ch){
  document.body.classList.add('mode-challenge');
  const gi = ALL.indexOf(ch) + 1;
  const prev = ALL[gi - 2], next = ALL[gi];
  app.innerHTML = `<div class="screen">
    ${topbarHTML({ crumb: `${ch.module.title} <span class="sep">/</span> <b>${esc(ch.title)}</b>` })}
    <div class="challenge">
      <aside class="brief">
        <div class="stamps">
          <span class="stamp">Урок ${String(gi).padStart(2, '0')} / ${ALL.length}</span>
          <span class="stamp ghost">${ch.module.title}</span>
        </div>
        <h1>${ch.title}</h1>
        <ol class="steps">${ch.steps.map(s => `<li><div>${s}</div></li>`).join('')}</ol>
        ${ch.note ? `<div class="note">${ch.note}</div>` : ''}
        ${ch.hint ? `<details class="hint"><summary>${icon('bulb', 14)} Подсказка</summary><div class="hint-body">${ch.hint}</div></details>` : ''}
        <div class="brief-nav">
          <button class="btn small" id="bn-prev" ${prev ? '' : 'disabled'}>${icon('left', 13)} Назад</button>
          <button class="btn small" id="bn-next" ${next ? '' : 'disabled'}>Далее ${icon('right', 13)}</button>
        </div>
      </aside>
      <section class="workbench">
        <div class="toolbar">
          <button class="btn small" id="btn-run">${icon('play', 12)} Запустить</button>
          <button class="btn small primary" id="btn-check">${icon('check', 13)} Проверить · ${(ch.tests || []).length}</button>
          <button class="btn small ghost" id="btn-seed" title="Вернуть стартовый код">${icon('reset', 13)}</button>
          <span class="kbd">ctrl+⏎ — запуск · ctrl+shift+⏎ — проверка</span>
        </div>
        <div class="editor-wrap"><div id="editor"></div></div>
        <div class="console">
          <div class="console-bar"><span style="display:inline-flex;align-items:center;gap:8px">${icon('term', 13)} Консоль</span><button class="link" id="btn-clear">очистить</button></div>
          <div class="console-body" id="console-body"><div class="console-empty">// Нажмите «Запустить», чтобы выполнить код, или «Проверить», чтобы сдать урок.</div></div>
        </div>
      </section>
    </div>
  </div>`;

  initEditor(ch);
  el('btn-run').onclick = () => doRun(ch, 'run');
  el('btn-check').onclick = () => doRun(ch, 'check');
  el('btn-clear').onclick = () => { el('console-body').innerHTML = '<div class="console-empty">// очищено</div>'; };
  el('btn-seed').onclick = async () => {
    const ok = await confirmDlg({ title:'Вернуть стартовый код?', text:'Ваше текущее решение в этом уроке будет заменено исходным шаблоном.', ok:'Заменить' });
    if (!ok) return;
    state.code[ch.id] = ch.seed; save();
    if (cm) cm.setValue(ch.seed); else if (taEl) taEl.value = ch.seed;
    toast('Код сброшен к стартовому');
  };
  el('bn-prev').onclick = () => prev && go(prev.id);
  el('bn-next').onclick = () => next && go(next.id);
  el('btn-reset-progress').onclick = resetProgress;
}

function initEditor(ch){
  const host = el('editor');
  const val = state.code[ch.id] !== undefined ? state.code[ch.id] : ch.seed;
  cm = null; taEl = null;
  if (window.CodeMirror){
    cm = CodeMirror(host, {
      value: val, mode:'python', theme:'pycamp', lineNumbers:true,
      indentUnit:4, matchBrackets:true, autoCloseBrackets:true,
      extraKeys:{
        'Ctrl-Enter': () => doRun(ch, 'run'),
        'Cmd-Enter':  () => doRun(ch, 'run'),
        'Ctrl-Shift-Enter': () => doRun(ch, 'check'),
        'Cmd-Shift-Enter':  () => doRun(ch, 'check'),
        'Tab': cmi => cmi.somethingSelected() ? cmi.indentSelection('add') : cmi.replaceSelection('    ')
      }
    });
    let t = null;
    cm.on('change', () => {
      clearTimeout(t);
      t = setTimeout(() => { state.code[ch.id] = cm.getValue(); save(); }, 400);
    });
    setTimeout(() => cm.refresh(), 60);
  } else {
    host.innerHTML = '';
    const ta = document.createElement('textarea');
    ta.className = 'ta-fallback';
    ta.value = val;
    ta.spellcheck = false;
    ta.addEventListener('input', () => { state.code[ch.id] = ta.value; save(); });
    ta.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); doRun(ch, e.shiftKey ? 'check' : 'run'); }
    });
    host.appendChild(ta);
    taEl = ta;
  }
}
const getCode = () => cm ? cm.getValue() : taEl.value;

async function doRun(ch, mode){
  if (busy) return;
  busy = true;
  const rb = el('btn-run'), cb = el('btn-check');
  rb.classList.add('loading'); cb.classList.add('loading');
  rb.disabled = cb.disabled = true;
  const code = getCode();
  state.code[ch.id] = code; save();
  try{
    const res = await pyRun(code, mode === 'check' ? (ch.tests || []) : [], ch.stdin || [], ch.files || {});
    runtimeReadyEver = true;
    hideBoot(true);
    showResult(ch, mode, res);
  } catch(e){
    runtimeReadyEver = true;
    hideBoot(false);
    el('console-body').innerHTML = `<div class="err"><span class="err-tag">ошибка</span><span>${esc(e.message)}</span></div>`;
  }
  rb.classList.remove('loading'); cb.classList.remove('loading');
  rb.disabled = cb.disabled = false;
  busy = false;
}

function showResult(ch, mode, res){
  const body = el('console-body');
  let html = '';
  if (res.out) html += `<div class="out">${esc(res.out)}</div>`;
  if (res.err){
    const e = res.err;
    html += `<div class="err"><span class="err-tag">ошибка</span><span>Строка ${e.line != null ? e.line : '?'} — ${esc(e.type)}: ${esc(e.msg)}</span></div>`;
  }
  if (mode === 'check'){
    if (res.err){
      html += `<div class="blocked">Тесты не запускались — сначала исправьте ошибку в коде.</div>`;
    } else {
      const t = res.tests || [];
      const passed = t.filter(x => x.ok).length;
      html += `<div class="tests-head">Проверки — ${passed}/${t.length}</div>`;
      html += t.map(x =>
        `<div class="test ${x.ok ? 'ok' : 'fail'}">
          <span class="ti">${icon(x.ok ? 'check' : 'x', 13)}</span>
          <div><b>${esc(x.title)}</b>${x.ok ? '' : `<em>${esc(x.msg)}</em>`}</div>
        </div>`).join('');
      if (t.length && t.every(x => x.ok)){
        const first = !state.solved[ch.id];
        if (first){ state.solved[ch.id] = true; save(); updatePill(); }
        const nx = ALL[ALL.indexOf(ch) + 1];
        html += `<div class="success">
          <div><b>${first ? 'Все проверки пройдены — урок сдан!' : 'Урок уже был сдан — отличная работа.'}</b>
          <span>${first ? `Прогресс: ${solvedCount()}/${ALL.length}.` : ''}</span></div>
          ${nx
            ? `<button class="btn small primary" id="go-next">Следующий урок ${icon('right', 12)}</button>`
            : `<button class="btn small primary" id="go-cert">Курс пройден — к сертификату ${icon('right', 12)}</button>`}
        </div>`;
        if (first) toast(`Урок сдан · ${solvedCount()}/${ALL.length}`, 'ok');
        body.innerHTML = html;
        const gn = el('go-next');
        if (gn) gn.onclick = () => go(nx.id);
        const gc = el('go-cert');
        if (gc) gc.onclick = () => {
          location.hash = '#/';
          setTimeout(() => { const c = el('cert'); if (c) c.scrollIntoView({ behavior:'smooth' }); }, 200);
          toast('Курс полностью пройден!', 'ok');
        };
        return;
      }
    }
  }
  body.innerHTML = html || '<div class="console-empty">// Код выполнен. Вывода нет — если это неожиданно, проверьте print().</div>';
}

/* ---------- сброс прогресса ---------- */
async function resetProgress(){
  const ok = await confirmDlg({
    title:'Сбросить прогресс?',
    text:'Будут удалены отметки о сданных уроках и весь сохранённый код. Это действие нельзя отменить.',
    ok:'Сбросить всё', danger:true
  });
  if (!ok) return;
  state = { solved:{}, code:{}, name: state.name };
  save();
  toast('Прогресс сброшен');
  route();
}

/* ---------- сертификат (canvas → PNG) ---------- */
async function downloadCert(){
  const name = (state.name || '').trim() || 'Безымянный питонист';
  try{ await document.fonts.ready; }catch(e){}
  const W = 1600, H = 1130;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#F3EDDD'; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(35,29,16,.05)';
  for (let i = 24; i < W; i += 28) for (let j = 24; j < H; j += 28) x.fillRect(i, j, 2, 2);
  x.strokeStyle = '#231D10';
  x.lineWidth = 6; x.strokeRect(42, 42, W - 84, H - 84);
  x.lineWidth = 2; x.strokeRect(66, 66, W - 132, H - 132);
  x.fillStyle = '#C2481B';
  [[66, 66], [W - 82, 66], [66, H - 82], [W - 82, H - 82]].forEach(([a, b]) => x.fillRect(a, b, 16, 16));
  x.textAlign = 'center';
  x.fillStyle = '#231D10';
  x.font = '700 30px "JetBrains Mono", monospace';
  x.fillText('PYCAMP · СЕРТИФИКАТ', W / 2, 195);
  x.font = '400 26px "Space Grotesk", sans-serif';
  x.fillText('настоящим подтверждается, что', W / 2, 330);
  x.fillStyle = '#C2481B';
  x.font = '700 92px "Space Grotesk", sans-serif';
  x.fillText(name, W / 2, 470, 1040);
  x.strokeStyle = '#231D10'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(W / 2 - 330, 512); x.lineTo(W / 2 + 330, 512); x.stroke();
  x.fillStyle = '#231D10';
  x.font = '400 28px "Space Grotesk", sans-serif';
  x.fillText('успешно завершил(а) полный курс', W / 2, 606);
  x.font = '700 46px "Space Grotesk", sans-serif';
  x.fillText('«Python: с нуля до собственных классов»', W / 2, 678);
  x.fillStyle = '#5F563F';
  x.font = '400 22px "JetBrains Mono", monospace';
  x.fillText(`${ALL.length} уроков · ${MODULES.length} модулей · код выполнялся в браузере · ${new Date().toLocaleDateString('ru-RU')}`, W / 2, 786);
  x.fillStyle = '#231D10';
  x.font = '700 26px "JetBrains Mono", monospace';
  x.fillText('‹_› PyCamp', W / 2, 952);
  const a = document.createElement('a');
  a.download = 'pycamp-certificate.png';
  a.href = c.toDataURL('image/png');
  a.click();
  toast('Сертификат сохранён', 'ok');
}

/* ---------- роутер ---------- */
const app = el('app');
function route(){
  const m = location.hash.match(/^#\/c\/(.+)$/);
  const ch = m && ALL.find(c => c.id === m[1]);
  if (ch) renderChallenge(ch);
  else renderMap();
}
window.addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ch]');
  if (b) go(b.dataset.ch);
});
route();
</script>
